<title>로트 추적 화이트 카드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* 레이아웃: 위 가로 메뉴 → 제목 줄(예시 로트 고르기) → 머리 카드(상태 태그 · 로트 번호 · 공정 길) → 찾기·계보 → 설비별 시간표 → 수량 | 보류·폐기 → 색 규칙표.
   규칙: 카드는 전부 흰색 + 얇은 선. 색은 아이콘 칸과 태그에만, 파랑 계열 파스텔로 살짝. 꽉 찬 색은 '찾기' 버튼 하나. 상태색(초록·주황·빨강)은 태그 안에서만.
   공정 5색은 파랑 집안 안에서 색 간격을 벌려 이웃 공정끼리 번갈아 다르게(청록 · 파랑 · 보라 · 회청 · 하늘). 초록·주황·빨강과는 안 겹친다. 밝은 테마 하나로 고정(앱이 밝은 화면만 씀) */
:root{
  color-scheme:light;
  --ground:#f5f8fc;              /* 화면 바탕: 아주 옅은 하늘빛 흰색 */
  --card:#ffffff;                /* 카드: 무조건 흰색 */
  --line:#e3e9f2; --line-2:#edf1f7;
  --ink:#1b2a41; --ink-2:#56667d; --ink-3:#7d8ca1;
  --blue:#3d6fe0; --blue-ink:#2a55b8; --blue-50:#f2f7ff; --blue-100:#e5effe; --blue-200:#cbdcfb;
  /* 공정 색 (칸 바탕 / 아이콘 / 막대 / 막대 글자) */
  --op1:#dff3f7; --op1-i:#0f8299; --op1-b:#c2e7ef; --op1-t:#0a5a6b; /* 청록 */
  --op2:#e6eefe; --op2-i:#3a6fe0; --op2-b:#cfdcfb; --op2-t:#234fae; /* 파랑 */
  --op3:#f0e9fd; --op3-i:#7b4fe0; --op3-b:#e0d1fb; --op3-t:#5532b6; /* 보라 */
  --op4:#eceff4; --op4-i:#57677e; --op4-b:#d6dde7; --op4-t:#344157; /* 회청 */
  --op5:#e3f3fd; --op5-i:#1f8ad2; --op5-b:#c4e4f9; --op5-t:#135f96; /* 하늘 */
  /* 상태 태그 */
  --ok:#157a4f; --ok-bg:#e6f6ef; --ok-dot:#2bb673;
  --warn:#a35a0c; --warn-bg:#fff3e3;
  --crit:#c23042; --crit-bg:#fdecee; --crit-b:#f6c9cf;
  --font:"Noto Sans KR",system-ui,"Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;word-break:keep-all;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue-200);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.page{padding-block:12px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1360px;margin:0 auto}

/* 위 가로 메뉴: 흰 바, 선택 메뉴는 옅은 파랑 칸 + 파랑 글자 */
.bar{position:sticky;top:calc(10px + env(safe-area-inset-top,0px));z-index:30;display:flex;align-items:center;gap:4px;height:60px;padding:0 16px 0 18px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;flex:none}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--blue-100);display:grid;place-items:center;color:var(--blue);font-style:normal;font-size:14px;font-weight:800}
.logo span{font-weight:400;color:var(--ink-2);letter-spacing:.1em;font-size:14px}
nav{display:flex;gap:2px;margin-left:22px;overflow-x:auto;scrollbar-width:none}
.nav{display:flex;align-items:center;gap:7px;height:40px;padding:0 13px;border:0;border-radius:10px;background:none;font-size:16px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.nav svg{color:var(--ink-3)}
.nav:hover{background:var(--blue-50)}
.nav[aria-current="page"]{background:var(--blue-100);color:var(--blue-ink)}
.nav[aria-current="page"] svg{color:var(--blue)}
.clock{margin-left:auto;display:flex;align-items:center;gap:10px;white-space:nowrap}
.clock b{font-size:18px}
.who{margin-left:14px;font-size:15px;font-weight:700;color:var(--ink-2);white-space:nowrap}

/* 태그: 옅은 바탕 + 진한 글자. 화면의 색은 대부분 여기서 나온다 */
.tag{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:8px;font-size:15px;font-weight:700;white-space:nowrap;background:var(--blue-50);color:var(--ink-2)}
.tag i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.tag.lg{height:38px;padding:0 14px;font-size:17px;border-radius:10px}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.ok i{background:var(--ok-dot)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.crit{background:var(--crit-bg);color:var(--crit)}
.tag.blue{background:var(--blue-100);color:var(--blue-ink)}
.tag.plain{background:var(--card);border:1px solid var(--line);color:var(--ink-2);font-weight:500}
.tag.live i{position:relative}
.tag.live i::after{content:"";position:absolute;inset:0;border-radius:50%;background:currentColor;animation:ping 1.8s ease-out infinite}
@keyframes ping{to{transform:scale(2.4);opacity:0}}

/* 아이콘 칸 */
.ico{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;flex:none;background:var(--blue-100);color:var(--blue)}
.ico svg{width:18px;height:18px}
.ico.sm{width:28px;height:28px;border-radius:8px}
.ico.sm svg{width:15px;height:15px}

/* 제목 줄 */
.ptitle{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:28px 2px 16px}
.ptitle h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.3}
.ptitle p{margin:2px 0 0;color:var(--ink-2);font-size:15px}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.seg button{height:34px;padding:0 14px;border:0;border-radius:9px;background:none;font-size:15px;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--blue-100);color:var(--blue-ink)}
.seg-wrap{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-3)}

main{display:flex;flex-direction:column;gap:16px}
.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 1px 2px rgba(27,42,65,.04),0 10px 26px -18px rgba(27,42,65,.22)} /* 큰 카드에만 아주 옅은 그림자 — 흰 바탕 위에서 층이 생기게 */
.ch{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ch h2{margin:0;font-size:18px;font-weight:800}
.ch .sub{font-size:15px;color:var(--ink-3)}
.ch .end{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* 머리 카드 */
/* 결론 = 상태와 출하 여부 두 개만 크게. 나머지(작업지시 · 원자재 · 판정 수 · 불합격)는 회색 글자 */
.head-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.head-tags{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag.xl{height:44px;padding:0 18px;border-radius:12px;font-size:20px;font-weight:800;gap:8px}
.tag.xl i{width:10px;height:10px}
.tag.xl svg{width:18px;height:18px}
.tag.out{background:var(--card);box-shadow:inset 0 0 0 1.5px currentColor} /* 출하 여부 = 테두리만 — 상태(합격)와 같은 모양이 반복되지 않게 */
.lotno{margin:18px 0 8px;font-size:42px;font-weight:800;line-height:1.1;letter-spacing:-.03em}
.facts{display:flex;flex-wrap:wrap;gap:4px 22px;margin:0;font-size:15px;color:var(--ink-2)}
.facts span{white-space:nowrap}
.facts em{font-style:normal;color:var(--ink-3);margin-right:6px}
.live{font-size:14px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok-dot)}

/* 공정 길: 다섯 칸을 가는 선으로 잇는다 — 이 화면에서 유일하게 눈에 띄는 장치 */
.route{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:24px}
.route::before{content:"";position:absolute;left:28px;right:28px;top:41px;height:2px;background:repeating-linear-gradient(90deg,var(--blue-200) 0 6px,transparent 6px 11px)}
.stop{position:relative;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.stop .r1{display:flex;align-items:center;gap:10px}
.stop .ico{width:44px;height:44px;border-radius:12px;box-shadow:0 0 0 5px var(--card)}
.stop .ico svg{width:20px;height:20px}
.stop .nm{font-size:17px;font-weight:800;line-height:1.25}
.stop .cd{font-size:14px;color:var(--ink-3)}
.stop .r2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stop .tag{height:26px;font-size:14px;padding:0 9px}
.thin{height:5px;border-radius:999px;background:var(--line-2);overflow:hidden}
.thin b{display:block;height:100%;border-radius:999px}
/* 다 끝난 로트: 공정 길을 한 줄 띠로 줄인다 (카드 5장이 모두 '완료'로 반복되지 않게) */
.route-done{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:22px;padding:12px 16px;border:1px solid var(--line);border-radius:14px}
.mini{display:flex;align-items:center;flex-wrap:wrap;gap:8px 0;margin:0;padding:0;list-style:none}
.mini li{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;white-space:nowrap}
.mini li + li::before{content:"";width:26px;height:2px;margin:0 10px;background:repeating-linear-gradient(90deg,var(--blue-200) 0 4px,transparent 4px 7px)}
.mini li small{font-size:13px;font-weight:500;color:var(--ink-3)}

/* 찾기 · 계보 */
.find{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search{position:relative;width:min(340px,100%)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{width:100%;height:46px;padding:0 12px 0 40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px}
.search input:focus{outline:none;border-color:var(--blue-200);box-shadow:0 0 0 3px var(--blue-50)}
.search input::placeholder{color:var(--ink-3)}
.btn{height:46px;padding:0 22px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:16px;font-weight:800}
.btn:hover{background:var(--blue-ink)}
.ex{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px;color:var(--ink-3);margin-left:6px}
.ex button{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:14px;color:var(--ink-2)}
.ex button:hover{border-color:var(--blue-200);color:var(--blue-ink)}
.tree{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:18px;border-top:1px solid var(--line-2)}
.mat{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:12px;border:1px solid var(--line)}
.mat small{display:block;font-size:13px;color:var(--ink-3);line-height:1.2}
.mat b{font-size:16px}
.join{width:20px;height:2px;background:var(--line)}
.lot{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:700}
.lot i{width:8px;height:8px;border-radius:50%;background:var(--ok-dot)}
.lot.run i{background:var(--blue)}
.lot.run{border-style:dashed}
.lot[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-100);color:var(--blue-ink);font-weight:800;box-shadow:inset 0 0 0 1px var(--blue),0 4px 12px -6px rgba(61,111,224,.5)}
.lot[aria-pressed="true"]::after{content:"보는 중";margin-left:2px;padding:1px 7px;border-radius:6px;background:var(--card);color:var(--blue-ink);font-size:12px;font-weight:700}
.tree-note{margin-top:10px;font-size:14px;color:var(--ink-3)}

/* 설비별 시간표 */
.legend{display:flex;flex-wrap:wrap;gap:6px}
.tlwrap{overflow-x:auto}
.tl{position:relative;min-width:880px}
.grid{display:grid;grid-template-columns:176px minmax(0,1fr)}
.axis{position:relative;height:30px;font-size:14px;color:var(--ink-3)}
.axis span{position:absolute;top:2px;transform:translateX(-50%);white-space:nowrap}
.axis span:first-child{transform:none}
.eq{height:58px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--line-2)}
.eq b{display:block;font-size:16px;line-height:1.2}
.eq small{font-size:13px;color:var(--ink-3)}
.lane{position:relative;height:58px;border-top:1px solid var(--line-2)}
.vl{position:absolute;top:0;bottom:0;width:1px;background:var(--line-2)}
.job{position:absolute;top:13px;height:32px;border-radius:8px;font-size:14px;font-weight:700;line-height:32px;padding:0 10px;white-space:nowrap;overflow:hidden;transform-origin:left;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.alarm{position:absolute;top:0;bottom:0;background:var(--crit-bg);border-top:2px solid var(--crit-b)}
.alarm .tag{position:absolute;left:4px;bottom:2px;height:20px;font-size:12px;padding:0 6px;border-radius:5px;background:var(--card)}
.now{position:absolute;top:30px;bottom:0;width:2px;background:var(--ink);pointer-events:none}
.now span{position:absolute;top:-30px;right:-1px;padding:1px 9px;border-radius:7px;background:var(--ink);color:#fff;font-size:13px;font-weight:700;white-space:nowrap}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* 수량 · 보류 */
.two{display:grid;grid-template-columns:1.15fr 1fr;gap:16px}
.q{display:grid;grid-template-columns:168px minmax(0,1fr) 100px;gap:16px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2)}
.q:first-of-type{border-top:0}
.q > span{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;white-space:nowrap}
.qbar{display:flex;gap:2px;height:10px;border-radius:999px;background:var(--line-2);overflow:hidden}
.qbar b{display:block;height:100%}
.q .v{text-align:right}
.q .v b{font-size:20px}
.q .v small{display:block;font-size:13px;color:var(--ink-3)}
.hold{display:flex;gap:8px;flex-wrap:wrap}
.hold input{height:44px;flex:1 1 200px;min-width:0;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px}
.hold button{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px;font-weight:700;color:var(--ink-3)}
.scrap{margin-top:16px;padding-top:16px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.soft-btn{height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--blue-200);background:var(--blue-50);color:var(--blue-ink);font-size:16px;font-weight:800}
.soft-btn:hover{background:var(--blue-100)}
.ghost{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:700;color:var(--ink-2)}
.ghost:hover{border-color:var(--blue-200);color:var(--blue-ink)}
.muted{font-size:14px;color:var(--ink-3)}

/* 색 규칙표 */
.rules p{margin:0 0 16px;color:var(--ink-2);font-size:15px;max-width:72ch}
.rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.rg h3{margin:0 0 8px;font-size:15px;font-weight:800}
.sw{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line-2)}
.sw i{width:36px;height:28px;border-radius:8px;border:1px solid rgba(27,42,65,.08)}
.sw b{font-size:15px;display:block;line-height:1.3}
.sw small{font-size:13px;color:var(--ink-2);display:block;line-height:1.3}
.sw code{font-size:13px;color:var(--ink-3);font-family:inherit}

@media (prefers-reduced-motion:reduce){.job,.tag.live i::after{animation:none}}
@media (max-width:1100px){.two{grid-template-columns:minmax(0,1fr)}.who{display:none}}
@media (max-width:820px){.route{grid-template-columns:repeat(5,minmax(160px,1fr));overflow-x:auto;padding-bottom:4px}.route::before{display:none}.lotno{font-size:32px}.clock b:first-child{display:none}.q{grid-template-columns:142px minmax(0,1fr) 112px;gap:10px}.q > span{font-size:15px}}
</style>

<div class="page"><div class="wrap">
  <header class="bar">
    <div class="logo"><i>e</i>eve<span>TECH</span></div>
    <nav aria-label="메뉴" id="menu"></nav>
    <span class="clock"><span class="tag">야간</span><b class="num">10/2</b><b class="num">01:57</b></span>
    <span class="who">반장 · 야간 1 ▾</span>
  </header>

  <div class="ptitle">
    <div><h1>로트 추적</h1><p>원자재부터 출하까지 한 로트가 지나온 길을 봅니다.</p></div>
    <div class="seg-wrap">예시 로트<span class="seg" role="group" aria-label="예시 로트">
      <button data-k="done" aria-pressed="true">합격</button><button data-k="run" aria-pressed="false">생산 중</button></span></div>
  </div>

  <main>
    <section class="card" id="head" aria-live="polite"></section>

    <section class="card">
      <div class="find">
        <div class="search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="로트 · 원자재 · 출하 번호로 찾기" aria-label="로트 · 원자재 · 출하 번호"></div>
        <button class="btn">찾기</button>
        <div class="ex">예시 <button class="num">MAT-2609-11</button><button class="num">SHP-2609-001</button><button class="num">LOT-2609-001-1</button></div>
      </div>
      <div class="tree" id="tree"></div>
      <div class="tree-note">같은 원자재에서 나온 생산 로트 5개 (DOC-06 §7)</div>
    </section>

    <section class="card">
      <div class="ch"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><h2>설비별 시간표</h2><span class="sub num" id="tlsub"></span>
        <div class="end legend" id="legend"></div></div>
      <div class="tlwrap"><div class="tl" id="tl"></div></div>
    </section>

    <div class="two">
      <section class="card">
        <div class="ch"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/></svg></span><h2>수량</h2><span class="end"><button class="ghost">검사 기록 보기</button></span></div>
        <div id="qty"></div>
      </section>
      <section class="card">
        <div class="ch"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span><h2>보류와 폐기</h2><span class="sub num" id="hsub"></span></div>
        <div id="hold"></div>
      </section>
    </div>

    <section class="card rules" aria-label="색 규칙">
      <div class="ch"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="9" r="2"/><circle cx="15" cy="7" r="2"/><circle cx="17" cy="14" r="2"/><path d="M12 21a9 9 0 1 1 9-9c0 2-1.5 3-3 3h-2a2 2 0 0 0-1 3.7A2 2 0 0 1 12 21z"/></svg></span><h2>이 화면의 색 규칙</h2></div>
      <p>카드는 모두 흰색이고, 색은 아이콘 칸과 태그에만 들어갑니다. 꽉 찬 색은 화면에 하나(찾기 버튼)뿐입니다. 공정 다섯 색은 모두 파랑 계열이라 같이 놓여도 한 톤으로 보이고, 초록·주황·빨강은 상태 태그 안에서만 씁니다.</p>
      <div class="rg" id="rules"></div>
    </section>
  </main>
</div></div>

<script>
// 예시 데이터 (모양 보기용). shortcut: 시각·수량은 예시값, 실제 화면은 /api/lots
const P = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const NAV = [['홈','<path d="M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5M10 21v-6h4v6"/>'],['생산','<path d="M2 20h20M4 20V9l5 3V9l5 3V5h6v15"/>'],['정비','<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z"/>'],['품질','<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>'],['재고','<path d="M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/>'],['문서','<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8zM14 3v5h5M9 13h6M9 17h6"/>'],['설정','<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/>']];
document.getElementById('menu').innerHTML = NAV.map(([n,d]) => `<button class="nav"${n==='생산'?' aria-current="page"':''}><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>${n}</button>`).join('');

// 공정 = [코드, 설비, 이름, 색, 아이콘]
const OPS = [
  ['OP-10','SAW-01','절단','op1','<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/>'],
  ['OP-20','MIL-01','황삭','op2','<path d="M12 2v6M8 8h8l-1 6H9zM10 14v6M14 14v6"/>'],
  ['OP-30','VF2-01/02','정밀 가공','op3','<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/>'],
  ['OP-40','WSH-01','디버링·세척','op4','<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>'],
  ['OP-50','CMM-01','측정','op5','<path d="M3 17 17 3l4 4L7 21zM7 13l2 2M10 10l2 2M13 7l2 2"/>']];
const EQS = [['SAW-01',0],['MIL-01',1],['VF2-01',2],['VF2-02',2],['WSH-01',3],['CMM-01',4]];
const LOTS = {
  done:{no:'LOT-2610-001-1',po:'PO-2610-001',shift:'10/1 주간 투입',tag:['ok','합격'],note:'OP-50 판정 24 / 24',side:['plain','불합격 1개 폐기 대기'],ship:true,
    done:[24,24,24,24,24],input:24,pass:23,fail:1,fg:23,shipped:0,shipSub:'출하 가능',
    jobs:{'SAW-01':[['15:20','17:10','24개']],'MIL-01':[['16:10','17:10','15개'],['17:10','20:10','9개']],'VF2-01':[['17:30','21:20','12개']],'VF2-02':[['18:00','21:40','12개']],'WSH-01':[['19:00','22:30','24개']],'CMM-01':[['19:40','23:10','24개']]},
    alarm:['VF2-01','19:10','19:40','알람 174']},
  run:{no:'LOT-2610-002-1',po:'PO-2610-002',shift:'10/1 야간 투입',tag:['blue live','생산 중'],note:'OP-50 판정 9 / 24',side:null,ship:false,
    done:[24,24,24,17,9],input:24,pass:9,fail:0,fg:9,shipped:0,shipSub:'출하 금지',
    jobs:{'SAW-01':[['17:20','19:00','24개']],'MIL-01':[['18:10','21:40','24개']],'VF2-01':[['19:30','23:50','12개']],'VF2-02':[['20:00','00:40','12개']],'WSH-01':[['21:30','01:57','17개']],'CMM-01':[['22:40','01:57','9개']]},
    alarm:['VF2-02','23:10','23:55','고장 966']}
};
const T0 = 15*60, TOT = 660; // 10/1 15:00 ~ 10/2 02:00
const m = s => { const [h,mi] = s.split(':').map(Number); return (h*60+mi-T0+1440)%1440; };
const pct = v => `${v/TOT*100}%`;
const LOCK = P('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>');
const ico = (k, cls='') => `<span class="ico ${cls}" style="background:var(--${k});color:var(--${k}-i)">`;

function draw(k){
  const L = LOTS[k];
  document.getElementById('head').innerHTML = `
    <div class="head-top">
      <div class="head-tags"><span class="tag xl ${L.tag[0]}"><i></i>${L.tag[1]}</span>${L.ship?'<span class="tag xl ok out"><i></i>출하 가능</span>':`<span class="tag xl warn out">${LOCK}출하 금지</span>`}</div>
      <span class="live num"><i></i>실시간, 10/2 01:57 기준</span>
    </div>
    <div class="lotno num">${L.no}</div>
    <p class="facts"><span><em>작업지시</em><span class="num">${L.po}</span></span><span><em>원자재</em><span class="num">MAT-2609-11</span></span><span><em>투입</em>${L.shift.replace(' 투입','')}</span><span><em>OP-50 판정</em><span class="num">${L.note.replace('OP-50 판정 ','')}</span></span>${L.side?`<span><em>불합격</em>${L.side[1].replace('불합격 ','')}</span>`:''}</p>
    ${L.done.every(n=>n>=L.input) ? `<div class="route-done"><span class="tag ok"><i></i>공정 5단계 모두 완료</span><ol class="mini">${OPS.map(([op,,name,c,d]) => `<li>${ico(c,'sm')}${P(d)}</span>${name}<small class="num">${op}</small></li>`).join('')}</ol></div>` :
    `<div class="route">${OPS.map(([op,eq,name,c,d],i) => { const n=L.done[i], full=n>=L.input;
      return `<div class="stop"><div class="r1">${ico(c)}${P(d)}</span><div><div class="nm">${name}</div><div class="cd num">${op} · ${eq}</div></div></div>
        <div class="r2"><span class="tag num ${full?'':n?'blue':''}" style="${full?`background:var(--${c});color:var(--${c}-t)`:''}">${full?'완료':n?`${n} / ${L.input}`:'대기'}</span><span class="muted num">${full?`${n}개`:''}</span></div>
        <div class="thin"><b style="width:${n/L.input*100}%;background:var(--${c}-i);opacity:.55"></b></div></div>`; }).join('')}</div>`}`;

  const tree = [['LOT-2609-128-3',0],['LOT-2609-129-1',0],['LOT-2610-001-1',0],['LOT-2610-001-2',0],['LOT-2610-002-1',1]];
  document.getElementById('tree').innerHTML = `<div class="mat"><span class="ico sm">${P('<path d="M4 7h16M4 12h16M4 17h16"/>')}</span><div><small>원자재</small><b class="num">MAT-2609-11</b></div></div><span class="join"></span>` +
    tree.map(([no,run]) => `<button class="lot num ${run?'run':''}" aria-pressed="${no===L.no}" title="${run?'생산 중':'합격'}"><i></i>${no}</button>`).join('');

  document.getElementById('tlsub').textContent = L.no;
  // 공정 이름은 각 줄 왼쪽에 이미 있으므로 범례는 알람만
  document.getElementById('legend').innerHTML = '<span class="tag crit" style="height:28px;font-size:14px">알람 구간</span>';
  const ticks = [0,2,4,6,8,10].map(i=>i*60);
  const lab = t => { const h=(15+t/60)%24; return (t===0?'10/1 ':t===540?'10/2 ':'')+String(h).padStart(2,'0')+':00'; };
  const vl = ticks.map(t=>`<div class="vl" style="left:${pct(t)}"></div>`).join('');
  let h = `<div class="grid"><div></div><div class="axis">${ticks.map(t=>`<span class="num" style="left:${pct(t)}">${lab(t)}</span>`).join('')}</div>`;
  EQS.forEach(([eq,oi],i) => {
    const [op,,name,c,d] = OPS[oi];
    const al = L.alarm[0]===eq ? `<div class="alarm" style="left:${pct(m(L.alarm[1]))};width:${pct(m(L.alarm[2])-m(L.alarm[1]))}"><span class="tag crit">${L.alarm[3]}</span></div>` : '';
    h += `<div class="eq">${ico(c,'sm')}${P(d)}</span><div><b class="num">${eq}</b><small>${op} ${name}</small></div></div><div class="lane">${vl}${al}${(L.jobs[eq]||[]).map(([s,e,t],j)=>`<div class="job num" style="left:${pct(m(s))};width:calc(${pct(m(e)-m(s))} - 3px);background:var(--${c}-b);color:var(--${c}-t);animation-delay:${.05+i*.05+j*.04}s">${L.no.slice(-5)}, ${t}</div>`).join('')}</div>`;
  });
  h += `</div><div class="now" style="left:calc(176px + (100% - 176px) * ${m('01:57')/TOT})"><span class="num">지금 01:57</span></div>`;
  document.getElementById('tl').innerHTML = h;

  const seg = (v,c) => v>0 ? `<b style="width:${v/L.input*100}%;background:${c}"></b>` : '';
  const BLUE = 'var(--blue-200)';
  document.getElementById('qty').innerHTML = [
    ['op1','<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>','투입', seg(L.input,BLUE), `${L.input}`, ''],
    ['op3','<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>','OP-50 판정', seg(L.pass,BLUE)+seg(L.fail,'var(--crit-b)'), `${L.pass+L.fail} / ${L.input}`, `합격 ${L.pass}, 불합격 ${L.fail}`],
    ['op5','<path d="M3 9h18l-2-5H5zM5 9v11h14V9M9 20v-6h6v6"/>','완제품 입고', seg(L.fg,BLUE), `${L.fg}`, ''],
    ['op4','<path d="M3 6h11v10H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>','출하', seg(L.shipped,BLUE), `${L.shipped}`, L.shipSub]
  ].map(([c,d,l,bar,n,s]) => `<div class="q"><span><span class="ico sm">${P(d)}</span>${l}</span><div class="qbar">${bar}</div><div class="v num"><b>${n}</b>${s?`<small>${s}</small>`:''}</div></div>`).join('');

  document.getElementById('hsub').textContent = L.no;
  document.getElementById('hold').innerHTML = `<div class="hold"><input id="reason" placeholder="보류 사유를 적어 주세요" aria-label="보류 사유"><button disabled>${L.ship?'판정이 끝나 보류할 수 없음':'보류'}</button></div>` +
    (L.fail ? `<div class="scrap"><button class="soft-btn">불합격 ${L.fail}개 폐기 결재 요청</button><span class="muted">결재 요청 전입니다. 관리자가 승인하면 폐기됩니다.</span></div>`
            : `<div class="scrap"><span class="muted">폐기할 불합격품이 없습니다.</span></div>`);
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k===k));
}
document.querySelector('.seg').addEventListener('click', e => { const b=e.target.closest('button'); if(b) draw(b.dataset.k); });
draw('done');

// 색 규칙표 — CSS 변수 값을 그대로 읽어 보여 줌
const css = getComputedStyle(document.documentElement), v = n => css.getPropertyValue(n).trim();
const RULES = [
  ['바탕과 카드',[['--ground','화면 바탕','아주 옅은 하늘빛 흰색'],['--card','카드','모든 카드 · 칸 · 입력칸'],['--line','선','카드 테두리'],['--ink','글자','제목 · 숫자'],['--ink-2','보조 글자','설명'],['--ink-3','흐린 글자','코드 · 눈금']]],
  ['포인트 파랑',[['--blue','파랑','찾기 버튼 하나만 꽉 찬 색'],['--blue-100','옅은 파랑','선택 메뉴 · 아이콘 칸 · 진행 태그'],['--blue-50','더 옅은 파랑','선택한 로트 · 보조 버튼'],['--blue-200','파랑 선','수량 막대 · 포커스']]],
  ['공정 색 (이웃 공정끼리 번갈아)',[['--op1-i','청록','OP-10 절단'],['--op2-i','파랑','OP-20 황삭'],['--op3-i','보라','OP-30 정밀 가공'],['--op4-i','회청','OP-40 디버링·세척'],['--op5-i','하늘','OP-50 측정']]],
  ['상태 태그 (태그 안에서만)',[['--ok-bg','정상','합격 · 출하 가능'],['--warn-bg','주의','출하 금지 · 결정 필요'],['--crit-bg','긴급','알람 · 불합격']]]
];
document.getElementById('rules').innerHTML = RULES.map(([g,rows]) => `<div><h3>${g}</h3>${rows.map(([n,name,use]) =>
  `<div class="sw"><i style="background:var(${n})"></i><div><b>${name}</b><small>${use}</small></div><code>${v(n)}</code></div>`).join('')}</div>`).join('');
</script>
