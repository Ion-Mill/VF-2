<title>로트 추적 파랑 톤</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* 파랑 톤 하나로 맞춘 프로젝트 테마 — 지금 앱의 로트 추적(LotScreen.tsx) 배치 그대로, 색만 바꿈.
   원칙: 색상 계열은 파랑 하나(포인트·남색·푸른 회색). 회색도 파랑 쪽으로 살짝 기울여 따로 놀지 않게. 상태색(초록·노랑·빨강)은 채도를 낮춰 파랑 옆에서 튀지 않게.
   레이아웃: 위 가로 메뉴(앱 공통) → 머리 카드 → 찾기·계보 → 설비별 시간표 → 수량 | 보류·해제·폐기 → 이 톤의 색 토큰표. 앱이 밝은 화면만 쓰므로 밝은 테마 하나로 고정 */
:root{
  color-scheme:light;
  /* 바탕 · 면 */
  --ground-a:#f8fafd; --ground-b:#eef3f9; --ground-c:#e5ecf6;
  --surface:#ffffff; --panel:#f1f5fb; --tile:#f4f7fb;
  --line:#dce4ee; --line-soft:#e9eff6; --track:#e4ebf4;
  /* 글자 (남색 쪽 회색) */
  --ink:#13213a; --ink-2:#4a5b73; --ink-3:#8192a8;
  /* 포인트 = 파랑 한 계열 */
  --blue:#2f6be0; --blue-hi:#5b93f5; --blue-deep:#1d4fb8; --blue-tint:#eaf1fe; --blue-line:#c2d5f7;
  --navy:#13284a; --navy-ico:#9fbcf3;
  --glow:rgba(47,107,224,.45);
  /* 상태 (채도 낮춤) */
  --ok:#0f7f57; --ok-bg:#e2f3eb; --ok-dot:#22a676;
  --warn:#975e00; --warn-bg:#fff3da; --warn-mark:#e0a300;
  --crit:#c2353a; --crit-bg:#fdeeee; --crit-line:#efbcbe;
  --font:"Noto Sans KR",system-ui,"Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground-b);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;word-break:keep-all;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.page{min-height:100%;background:linear-gradient(180deg,var(--ground-a) 0%,var(--ground-b) 50%,var(--ground-c) 100%);
  padding-block:12px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 위 가로 메뉴 */
.bar{position:sticky;top:calc(10px + env(safe-area-inset-top,0px));z-index:30;max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:6px;height:60px;padding:0 14px 0 20px;border-radius:20px;background:rgba(255,255,255,.88);border:1px solid #fff;box-shadow:0 1px 2px rgba(19,33,58,.05),0 14px 32px -18px rgba(19,40,74,.3);backdrop-filter:blur(20px)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-.02em;flex:none}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--blue);box-shadow:0 6px 14px -6px var(--glow)}
.logo span{font-weight:400;color:var(--ink-2);letter-spacing:.12em;font-size:15px}
nav{display:flex;gap:2px;margin-left:24px;overflow-x:auto;scrollbar-width:none}
.nav{display:flex;align-items:center;gap:7px;height:40px;padding:0 13px;border:0;border-radius:12px;background:none;font-size:16px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.nav svg{color:var(--ink-3)}
.nav:hover{background:var(--tile)}
.nav.on{background:var(--navy);color:#fff;box-shadow:0 8px 18px -10px rgba(19,40,74,.7)}
.nav.on svg{color:var(--navy-ico)}
.nav small{font-size:11px;opacity:.6}
.clock{margin-left:auto;display:flex;align-items:center;gap:10px;white-space:nowrap}
.shift{padding:2px 10px;border-radius:999px;background:var(--navy);color:#fff;font-size:14px;font-weight:700}
.clock b{font-size:19px}
.who{margin-left:14px;font-size:15px;font-weight:700;color:var(--ink-2);white-space:nowrap}

.wrap{max-width:1400px;margin:0 auto}
.ptitle{display:flex;align-items:baseline;gap:12px;margin:22px 4px 14px}
.ptitle h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.ptitle span{color:var(--ink-3);font-size:15px}
main{display:flex;flex-direction:column;gap:16px}
.card{min-width:0;border-radius:22px;background:var(--surface);border:1px solid #fff;padding:24px;
  box-shadow:0 1px 2px rgba(19,33,58,.04),0 18px 40px -26px rgba(19,40,74,.28)}

/* 머리 카드 */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.state{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--ink-2);font-size:17px}
.pill{display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 20px;border-radius:999px;font-size:20px;font-weight:800;color:#fff}
.pill.ok{background:var(--ok)}
.pill.todo{background:var(--blue)}
.pill i{width:10px;height:10px;border-radius:50%;background:#fff;position:relative}
.pill.todo i::after{content:"";position:absolute;inset:0;border-radius:50%;background:#fff;animation:ping 1.6s ease-out infinite}
@keyframes ping{to{transform:scale(2.6);opacity:0}}
.sub-pill{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:999px;background:var(--crit-bg);color:var(--crit);font-size:17px;font-weight:700}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.ship{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 22px;border-radius:999px;font-size:17px;font-weight:800}
.ship.ok{background:var(--ok-bg);color:var(--ok)}
.ship.ok i{width:10px;height:10px;border-radius:50%;background:var(--ok-dot)}
.ship.lock{background:var(--navy);color:#fff}
.live{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--ink-2)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok-dot)}
.lotno{margin:14px 0 0;font-size:46px;font-weight:800;line-height:1.1;letter-spacing:-.03em;color:var(--ink)}
.lotno span{color:var(--blue)}
.tags{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tag{padding:3px 12px;border-radius:8px;background:var(--panel);color:var(--ink-2);font-size:15px}

/* 막대: 파랑 한 계열 + 위 광택 + 옅은 빛. 진행 중 막대만 빛이 지나감 */
.track{position:relative;border-radius:999px;background:var(--track)}
.fill{position:relative;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue) 0%,var(--blue-hi) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 10px -3px var(--glow);transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.fill.run{overflow:hidden}
.fill.run::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:shine 3s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(260%)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;margin-top:24px}
.steps .track{height:7px}
.steps .code{margin-top:9px;font-size:15px;color:var(--ink-3)}
.steps .name{font-size:17px;font-weight:700}
.steps .name em{font-style:normal;color:var(--blue);margin-left:4px}
.steps .name .n{font-weight:700;margin-left:6px}
.steps .name .go-tag{margin-left:6px;padding:0 7px;border-radius:6px;background:var(--blue-tint);color:var(--blue-deep);font-size:14px}
.steps .name .wait{color:var(--ink-3);font-weight:400;margin-left:4px}

/* 찾기 · 계보 */
.find{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.find > b{font-size:17px}
.search{position:relative;width:min(320px,100%)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{width:100%;height:48px;padding:0 12px 0 42px;border-radius:14px;border:1px solid var(--line);background:var(--tile);font-size:17px}
.search input:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px var(--blue-tint)}
.search input::placeholder{color:var(--ink-3)}
.btn{height:48px;padding:0 24px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 18px -10px var(--glow)}
.btn:hover{background:var(--blue-deep)}
.ex{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px;color:var(--ink-2)}
.chip{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:15px}
.chip:hover{border-color:var(--blue);color:var(--blue-deep)}
.tree{margin-top:20px;border-radius:18px;background:var(--panel);padding:16px}
.tree .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mat{border-radius:12px;background:var(--navy);color:#fff;padding:6px 16px}
.mat small{display:block;font-size:14px;color:var(--navy-ico)}
.mat b{font-size:17px}
.ln{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink-2);margin:0 4px}
.ln i{width:24px;height:2px;background:var(--ink-3);border-radius:2px}
.lot{display:flex;align-items:center;gap:8px;height:42px;padding:0 13px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:16px;font-weight:700}
.lot span{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:500;color:var(--ink-2)}
.lot span i{width:8px;height:8px;border-radius:50%;background:var(--ok-dot)}
.lot.sel{border:2px solid var(--blue);background:var(--blue-tint)}
.lot.sel span{color:var(--blue-deep)}
.lot.live{border-style:dashed}
.lot.live span i{background:var(--blue)}
.note{margin-top:10px;font-size:15px;color:var(--ink-3)}
.meta{display:flex;align-items:flex-end;gap:12px 40px;margin-top:20px;padding-top:20px;border-top:1px solid var(--line-soft);flex-wrap:wrap}
.meta small{display:block;font-size:15px;color:var(--ink-3)}
.meta b{font-size:20px}
.meta em{font-style:normal;font-size:15px;color:var(--ink-2);margin-left:6px}
.ghost{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:16px;color:var(--ink);white-space:nowrap}
.ghost:hover{border-color:var(--blue);color:var(--blue-deep)}
.meta .ghost{margin-left:auto}

/* 설비별 시간표 */
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ch h2{margin:0;font-size:17px;font-weight:800}
.ch .sub{font-size:15px;color:var(--ink-3)}
.legend{margin-left:auto;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:15px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:20px;height:10px;border-radius:5px}
.tlwrap{overflow-x:auto}
.tl{position:relative;min-width:860px}
.grid{display:grid;grid-template-columns:150px minmax(0,1fr)}
.axis{position:relative;height:30px;font-size:14px;color:var(--ink-3)}
.axis span{position:absolute;top:2px;transform:translateX(-50%);white-space:nowrap}
.axis span:first-child{transform:none}
.eq{height:56px;display:flex;flex-direction:column;justify-content:center;border-top:1px solid var(--line-soft);line-height:1.25}
.eq b{font-size:17px}
.eq small{font-size:14px;color:var(--ink-2)}
.lane{position:relative;height:56px;border-top:1px solid var(--line-soft)}
.vl{position:absolute;top:0;bottom:0;width:1px;background:var(--line-soft)}
.job{position:absolute;top:12px;height:32px;border-radius:9px;color:#fff;font-size:14px;font-weight:700;line-height:32px;padding:0 10px;white-space:nowrap;overflow:hidden}
.alarm{position:absolute;top:0;bottom:0;border-top:2px solid var(--crit);background:var(--crit-bg)}
.alarm span{position:absolute;left:6px;bottom:1px;font-size:13px;color:var(--crit);white-space:nowrap}
.mark{position:absolute;top:30px;bottom:0;width:2px;pointer-events:none}
.mark span{position:absolute;top:-30px;transform:translateX(-50%);padding:1px 10px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap}
.mark.now{background:var(--navy)} .mark.now span{background:var(--navy);color:#fff}

/* 수량 · 보류 */
.two{display:grid;grid-template-columns:1.15fr 1fr;gap:16px}
.q{display:grid;grid-template-columns:118px minmax(0,1fr) 112px;gap:16px;align-items:center;padding:9px 0}
.q > b{font-size:17px}
.q .track{height:12px;display:flex;gap:2px;background:var(--track)}
.q .seg{height:100%;border-radius:999px}
.q .v{text-align:right}
.q .v b{font-size:20px}
.q .v small{display:block;font-size:14px;color:var(--ink-2)}
.hold{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line-soft)}
.hold input{height:46px;width:220px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--tile);font-size:16px}
.hold button{height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--tile);font-size:17px;font-weight:700;color:var(--ink-3)}
.scrap{margin-top:16px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.dark-btn{height:50px;padding:0 20px;border:0;border-radius:14px;background:var(--navy);color:#fff;font-size:17px;font-weight:800;box-shadow:0 10px 22px -12px rgba(19,40,74,.8)}
.dark-btn:hover{background:var(--blue-deep)}
.muted{font-size:15px;color:var(--ink-2)}

/* 색 토큰표 */
.tok h2{margin:0 0 4px;font-size:17px;font-weight:800}
.tok p{margin:0 0 16px;color:var(--ink-2);font-size:15px;max-width:72ch}
.tgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.tg h3{margin:0 0 8px;font-size:15px;color:var(--ink-3);font-weight:700;letter-spacing:.04em}
.sw{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line-soft)}
.sw i{width:40px;height:30px;border-radius:9px;border:1px solid rgba(19,33,58,.08)}
.sw b{font-size:15px;display:block;line-height:1.3}
.sw small{font-size:13px;color:var(--ink-2);display:block;line-height:1.3}
.sw code{font-size:13px;color:var(--ink-2);font-family:ui-monospace,Consolas,monospace}

/* 예시 바꾸기 */
.pick{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:4px;padding:5px 5px 5px 16px;border-radius:999px;background:var(--navy);box-shadow:0 16px 36px -12px rgba(19,40,74,.6);color:var(--navy-ico);font-size:14px;white-space:nowrap}
.pick button{height:38px;padding:0 16px;border:0;border-radius:999px;background:none;color:#dbe6fb;font-size:15px;font-weight:700}
.pick button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.eve{position:fixed;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;width:58px;height:58px;border-radius:50%;background:var(--navy);color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 26px -10px rgba(19,40,74,.7)}

@media (prefers-reduced-motion:reduce){.fill,.fill.run::after,.pill.todo i::after{animation:none}}
@media (max-width:1100px){.two{grid-template-columns:minmax(0,1fr)}.who{display:none}}
@media (max-width:760px){.clock b:first-of-type{display:none}.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.lotno{font-size:32px}.q{grid-template-columns:90px minmax(0,1fr) 84px;gap:10px}.pick span{display:none}.eve{display:none}}
</style>

<div class="page">
  <header class="bar">
    <div class="logo"><i></i>eve<span>TECH</span></div>
    <nav aria-label="메뉴" id="menu"></nav>
    <span class="clock"><span class="shift">야간</span><b class="num">10/2</b><b class="num">01:57</b></span>
    <span class="who">반장 · 야간 1 ▾</span>
  </header>

  <div class="wrap">
    <div class="ptitle"><h1>로트 추적</h1><span>원자재 → 공정 → 검사 → 입고 → 출하</span></div>
    <main>
      <section class="card" id="head" aria-live="polite"></section>

      <section class="card">
        <div class="find">
          <b>번호로 찾기</b>
          <div class="search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="LOT · MAT · SHP 번호" aria-label="로트 · 원자재 · 출하 번호"></div>
          <button class="btn">찾기</button>
          <div class="ex">예시 <button class="chip num">MAT-2609-11</button><button class="chip num">SHP-2609-001</button><button class="chip num">LOT-2609-001-1</button></div>
        </div>
        <div class="tree">
          <div class="row" id="tree"></div>
          <div class="note">원자재 1 : 생산 로트 5 (DOC-06 §7)</div>
        </div>
        <div class="meta" id="meta"></div>
      </section>

      <section class="card">
        <div class="ch"><h2>설비별 시간표</h2><span class="sub num" id="tlsub"></span>
          <div class="legend"><span><i style="background:var(--blue)"></i>이 로트</span><span><i style="background:var(--crit-bg);border-top:2px solid var(--crit);border-radius:2px"></i>알람</span><span><i style="width:2px;height:14px;border-radius:0;background:var(--navy)"></i>지금</span></div>
        </div>
        <div class="tlwrap"><div class="tl" id="tl"></div></div>
      </section>

      <div class="two">
        <section class="card">
          <div class="ch"><h2>수량</h2><button class="ghost" style="margin-left:auto">검사 기록</button></div>
          <div id="qty"></div>
        </section>
        <section class="card">
          <div class="ch"><h2>보류 · 해제 · 폐기</h2><span class="sub num" id="hsub"></span></div>
          <div id="hold"></div>
        </section>
      </div>

      <section class="card tok" aria-label="색 토큰">
        <h2>이 톤의 색 토큰</h2>
        <p>모든 화면이 아래 이름만 쓰면 같은 톤이 됩니다. 오른쪽 글자는 지금 <code>tailwind.config.ts</code>에서 바뀌는 자리입니다. 상태색(정상·주의·긴급)은 뜻이 바뀌지 않게 계열은 그대로 두고 채도만 파랑에 맞췄습니다.</p>
        <div class="tgroups" id="tok"></div>
      </section>
    </main>
  </div>
</div>
<div class="eve" aria-hidden="true">이브</div>
<div class="pick" role="group" aria-label="예시 로트"><span>예시 로트</span>
  <button data-k="done" aria-pressed="true">합격 · 출하 가능</button>
  <button data-k="run" aria-pressed="false">생산 중</button>
</div>

<script>
// 예시 데이터 (모양 보기용). shortcut: 시각·수량은 예시값, 실제 화면은 /api/lots
const NAV = [['홈','M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5M10 21v-6h4v6',0],['생산','M2 20h20M4 20V9l5 3V9l5 3V5h6v15M8 16h1M13 16h1M17 16h1',1],['정비','M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z',1],['품질','M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zM8 12l3 3 5-6',1],['재고','M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',1],['문서','M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8zM14 3v5h5M9 13h6M9 17h6',1],['설정','M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1',0]];
document.getElementById('menu').innerHTML = NAV.map(([n,d,sub]) => `<button class="nav${n==='생산'?' on':''}"${n==='생산'?' aria-current="page"':''}><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>${n}${sub?'<small>▾</small>':''}</button>`).join('');

const OPS = [['OP-10','SAW-01','절단'],['OP-20','MIL-01','황삭'],['OP-30','VF2-01/02','정밀 가공'],['OP-40','WSH-01','디버링·세척'],['OP-50','CMM-01','측정']];
const EQS = [['SAW-01','OP-10 절단'],['MIL-01','OP-20 황삭'],['VF2-01','OP-30 정밀 가공'],['VF2-02','OP-30 정밀 가공'],['WSH-01','OP-40 디버링·세척'],['CMM-01','OP-50 측정']];
const LOTS = {
  done:{no:'LOT-2610-001-1',po:'PO-2610-001',shift:'10/01 주간',status:'합격',tone:'ok',desc:'OP-50 판정 24 / 24',extra:'불합격 1개 따로 폐기',ship:true,
    done:[24,24,24,24,24],input:24,pass:23,fail:1,fg:23,shipped:0,shipSub:'가능',
    jobs:{'SAW-01':[['15:20','17:10','24개']],'MIL-01':[['16:10','17:10','15개'],['17:10','20:10','9개']],'VF2-01':[['17:30','21:20','12개']],'VF2-02':[['18:00','21:40','12개']],'WSH-01':[['19:00','22:30','24개']],'CMM-01':[['19:40','23:10','24개']]},
    alarm:['VF2-01','19:10','19:40','알람 174']},
  run:{no:'LOT-2610-002-1',po:'PO-2610-002',shift:'10/01 야간',status:'생산 중',tone:'todo',desc:'OP-50 판정 9 / 24',extra:'',ship:false,
    done:[24,24,24,17,9],input:24,pass:9,fail:0,fg:9,shipped:0,shipSub:'금지',
    jobs:{'SAW-01':[['17:20','19:00','24개']],'MIL-01':[['18:10','21:40','24개']],'VF2-01':[['19:30','23:50','12개']],'VF2-02':[['20:00','00:40','12개']],'WSH-01':[['21:30','01:57','17개']],'CMM-01':[['22:40','01:57','9개']]},
    alarm:['VF2-02','23:10','23:55','고장 966']}
};
const T0 = 15*60, TOT = 660; // 10/1 15:00 ~ 10/2 02:00
const m = s => { const [h,mi] = s.split(':').map(Number); return (h*60+mi-T0+1440)%1440; };
const pct = v => `${v/TOT*100}%`;
const LOCK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

function draw(k){
  const L = LOTS[k], parts = L.no.split('-');
  document.getElementById('head').innerHTML = `
    <div class="top">
      <div class="state"><span class="pill ${L.tone}"><i></i>${L.status}</span>${L.extra?`<span class="sub-pill">⚠ ${L.extra}</span>`:''}<span>${L.desc}</span></div>
      <div class="right">${L.ship?'<span class="ship ok"><i></i>출하 가능</span>':`<span class="ship lock">${LOCK} ${L.status} · 출하 금지</span>`}
        <span class="live num"><i></i>실시간 · 10/2 01:57 기준</span></div>
    </div>
    <div class="lotno num">${parts.slice(0,2).join('-')}-<span>${parts.slice(2).join('-')}</span></div>
    <div class="tags"><span class="tag num">${L.po}</span><span class="tag num">MAT-2609-11</span></div>
    <div class="steps">${OPS.map(([op,eq,name],i) => { const n=L.done[i], done=n>=L.input;
      return `<div><div class="track"><div class="fill ${n>0&&!done?'run':''}" style="width:${n/L.input*100}%;animation-delay:${i*.07}s"></div></div>
        <div class="code num">${op} · ${eq}</div>
        <div class="name">${name}${done?'<em>✓</em>':n>0?`<span class="n num">${n} / ${L.input}</span><span class="go-tag">진행</span>`:'<span class="wait">대기</span>'}</div></div>`; }).join('')}</div>`;

  const tree = [['LOT-2609-128-3','합격'],['LOT-2609-129-1','합격'],['LOT-2610-001-1','합격'],['LOT-2610-001-2','합격'],['LOT-2610-002-1','생산 중']];
  document.getElementById('tree').innerHTML = `<div class="mat"><small>원자재</small><b class="num">MAT-2609-11</b></div><span class="ln"><i></i>생산 로트</span>` +
    tree.map(([no,s]) => `<button class="lot num ${no===L.no?'sel':''} ${s==='생산 중'?'live':''}" aria-pressed="${no===L.no}">${no}<span><i></i>${s}</span></button>`).join('');
  document.getElementById('meta').innerHTML = `<div><small>LOT</small><b class="num">${L.no}</b></div><div><small>작업지시</small><b class="num">${L.po}</b><em>${L.shift}</em></div><div><small>원자재</small><b class="num">MAT-2609-11</b></div><button class="ghost">검사 발췌 · 검사 기록 →</button>`;

  document.getElementById('tlsub').textContent = L.no;
  const ticks = [0,2,4,6,8,10].map(i=>i*60);
  const lab = t => { const h=(15+t/60)%24; return (t===0?'10/1 ':h===0||t===540?'10/2 ':'')+String(h).padStart(2,'0')+':00'; };
  const vl = ticks.map(t=>`<div class="vl" style="left:${pct(t)}"></div>`).join('');
  let h = `<div class="grid"><div></div><div class="axis">${ticks.map(t=>`<span class="num" style="left:${pct(t)}">${lab(t)}</span>`).join('')}</div>`;
  EQS.forEach(([eq,op],i) => {
    const al = L.alarm[0]===eq ? `<div class="alarm" style="left:${pct(m(L.alarm[1]))};width:${pct(m(L.alarm[2])-m(L.alarm[1]))}"><span>${L.alarm[3]}</span></div>` : '';
    h += `<div class="eq"><b class="num">${eq}</b><small>${op}</small></div><div class="lane">${vl}${al}${(L.jobs[eq]||[]).map(([s,e,t],j)=>`<div class="job fill num" style="left:${pct(m(s))};width:calc(${pct(m(e)-m(s))} - 2px);animation-delay:${.1+i*.06+j*.04}s">${L.no.slice(-5)} · ${t}</div>`).join('')}</div>`;
  });
  h += `</div><div class="mark now" style="left:calc(150px + (100% - 150px) * ${m('01:57')/TOT})"><span class="num" style="transform:translateX(-100%)">지금 01:57</span></div>`;
  document.getElementById('tl').innerHTML = h;

  const fillSeg = (v,c) => v>0 ? `<div class="seg ${c?'':'fill'}" style="width:${v/L.input*100}%;${c?`background:${c}`:''}"></div>` : '';
  document.getElementById('qty').innerHTML = [
    ['투입', fillSeg(L.input), `${L.input}`, ''],
    ['OP-50 판정', fillSeg(L.pass)+fillSeg(L.fail,'var(--crit)'), `${L.pass+L.fail} / ${L.input}`, `<span style="color:var(--ok)">합격 ${L.pass}</span> · <span style="color:var(--crit)">불합격 ${L.fail}</span>`],
    ['완제품 입고', fillSeg(L.fg), `${L.fg}`, ''],
    ['출하', fillSeg(L.shipped), `${L.shipped}`, L.shipSub]
  ].map(([l,bar,n,s]) => `<div class="q"><b>${l}</b><div class="track">${bar}</div><div class="v num"><b>${n}</b>${s?`<small>${s}</small>`:''}</div></div>`).join('');

  document.getElementById('hsub').textContent = L.no;
  document.getElementById('hold').innerHTML = `<div class="hold"><input id="reason" placeholder="보류 사유 (필수)" aria-label="보류 사유"><button disabled>보류 — ${L.ship?'판정 끝난 로트':'사유 필수'}</button></div>` +
    (L.fail ? `<div class="scrap"><button class="dark-btn">폐기 결재 요청 (반장) — 불합격 ${L.fail}개</button><span class="muted">결재: 요청 — → 승인 —</span></div>` : `<p class="muted" style="margin:16px 0 0">폐기할 불합격품 없음</p>`);
  document.querySelectorAll('.pick button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k===k));
}
document.querySelector('.pick').addEventListener('click', e => { const b=e.target.closest('button'); if(b) draw(b.dataset.k); });
draw('done');

// 색 토큰표 — CSS 변수에서 값을 읽어 그대로 보여 줌
const css = getComputedStyle(document.documentElement), v = n => css.getPropertyValue(n).trim();
const TOK = [
  ['바탕 · 글자',[['--ground-b','화면 바탕','바탕 그라데이션 가운데','ground'],['--panel','안쪽 칸','계보 상자 · 태그','tile'],['--line','카드 선','입력칸 · 버튼 테두리','line'],['--track','막대 바탕','진행 막대 빈 곳','track'],['--ink','글자','제목 · 숫자','ink'],['--ink-2','보조 글자','설명 · 단위','ink.2'],['--ink-3','흐린 글자','눈금 · 코드','ink.3']]],
  ['포인트 (파랑 한 계열)',[['--blue','파랑','막대 · 찾기 버튼 · 선택','point'],['--blue-hi','밝은 파랑','막대 끝 그라데이션','—'],['--blue-deep','짙은 파랑','파랑 바탕 위 글자 · hover','point.deep'],['--blue-tint','옅은 파랑','선택 칸 바탕','point.tint'],['--blue-line','파랑 선','포커스 고리','point.line'],['--navy','남색','메뉴 선택 · 원자재 · 결재 버튼','ink (차콜 자리)']]],
  ['상태 (뜻은 그대로)',[['--ok','정상','합격 알약 · 출하 가능','ok'],['--ok-bg','정상 바탕','출하 가능 칩','ok.bg'],['--warn','주의','판정 대기','warn'],['--warn-bg','주의 바탕','주의 칩','warn.bg'],['--crit','긴급','알람 · 불합격','crit'],['--crit-bg','긴급 바탕','알람 구간','crit.bg']]]
];
document.getElementById('tok').innerHTML = TOK.map(([g,rows]) => `<div class="tg"><h3>${g}</h3>${rows.map(([n,name,use,tw]) =>
  `<div class="sw"><i style="background:var(${n})"></i><div><b>${name} <code>${v(n)}</code></b><small>${use}</small></div><code>${tw}</code></div>`).join('')}</div>`).join('');
</script>
