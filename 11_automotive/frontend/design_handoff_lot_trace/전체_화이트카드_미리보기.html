<title>화이트 카드 전체 화면</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 위 가로 메뉴 → 제목 줄(예시 로트 고르기) → 머리 카드(상태 태그 · 로트 번호 · 공정 길) → 찾기·계보 → 설비별 시간표 → 수량 | 보류·폐기 → 색 규칙표.
   규칙: 카드는 전부 흰색 + 얇은 선. 색은 아이콘 칸과 태그에만, 파랑 계열 파스텔로 살짝. 꽉 찬 색은 '찾기' 버튼 하나. 상태색(초록·주황·빨강)은 태그 안에서만.
   공정 5색은 파랑 집안 안에서 색 간격을 벌려 이웃 공정끼리 번갈아 다르게(청록 · 파랑 · 보라 · 회청 · 하늘). 초록·주황·빨강과는 안 겹친다. 밝은 테마 하나로 고정(앱이 밝은 화면만 씀) */
:root{
  color-scheme:light;
  --ground:#f5f8fc;              /* 화면 바탕: 아주 옅은 하늘빛 흰색 */
  --card:#ffffff;                /* 카드: 무조건 흰색 */
  --line:#e3e9f2; --line-2:#edf1f7;
  --ink:#1b2a41; --ink-2:#56667d; --ink-3:#7d8ca1;
  --blue:#3d6fe0; --blue-ink:#2a55b8; --blue-50:#f2f7ff; --blue-100:#e5effe; --blue-200:#cbdcfb;
  /* 공정 색 (칸 바탕 / 아이콘 / 막대 / 막대 글자) */
  --op1:#dff3f7; --op1-i:#0f8299; --op1-b:#c2e7ef; --op1-t:#0a5a6b; /* 청록 */
  --op2:#e6eefe; --op2-i:#3a6fe0; --op2-b:#cfdcfb; --op2-t:#234fae; /* 파랑 */
  --op3:#f0e9fd; --op3-i:#7b4fe0; --op3-b:#e0d1fb; --op3-t:#5532b6; /* 보라 */
  --op4:#eceff4; --op4-i:#57677e; --op4-b:#d6dde7; --op4-t:#344157; /* 회청 */
  --op5:#e3f3fd; --op5-i:#1f8ad2; --op5-b:#c4e4f9; --op5-t:#135f96; /* 하늘 */
  /* 상태 태그 */
  --ok:#157a4f; --ok-bg:#e6f6ef; --ok-dot:#2bb673;
  --warn:#a35a0c; --warn-bg:#fff3e3;
  --crit:#c23042; --crit-bg:#fdecee; --crit-b:#f6c9cf;
  --font:"Pretendard Variable","Pretendard",system-ui,"Malgun Gothic",sans-serif;
}
:root[data-font="plex"]{--font:"IBM Plex Sans KR",system-ui,"Malgun Gothic",sans-serif}
:root[data-font="noto"]{--font:"Noto Sans KR",system-ui,"Malgun Gothic",sans-serif}

/* 한글 제목은 자간을 살짝 줄인다 */
h1,h2,.lotno{letter-spacing:-.02em}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;word-break:keep-all;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue-200);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.page{padding-block:12px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1360px;margin:0 auto}

/* 위 가로 메뉴: 흰 바, 선택 메뉴는 옅은 파랑 칸 + 파랑 글자 */
.bar{position:sticky;top:calc(10px + env(safe-area-inset-top,0px));z-index:30;display:flex;align-items:center;gap:4px;height:60px;padding:0 16px 0 18px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;flex:none}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--blue-100);display:grid;place-items:center;color:var(--blue);font-style:normal;font-size:14px;font-weight:700}
.logo span{font-weight:400;color:var(--ink-2);letter-spacing:.1em;font-size:14px}
nav{display:flex;gap:2px;margin-left:22px;overflow-x:auto;scrollbar-width:none}
.nav{display:flex;align-items:center;gap:7px;height:40px;padding:0 13px;border:0;border-radius:10px;background:none;font-size:16px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.nav svg{color:var(--ink-3)}
.nav:hover{background:var(--blue-50)}
.nav[aria-current="page"]{background:var(--blue-100);color:var(--blue-ink)}
.nav[aria-current="page"] svg{color:var(--blue)}
.clock{margin-left:auto;display:flex;align-items:center;gap:10px;white-space:nowrap}
.clock b{font-size:18px}
.who{margin-left:14px;font-size:15px;font-weight:600;color:var(--ink-2);white-space:nowrap}

/* 태그: 옅은 바탕 + 진한 글자. 화면의 색은 대부분 여기서 나온다 */
.tag{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:8px;font-size:15px;font-weight:600;white-space:nowrap;background:var(--blue-50);color:var(--ink-2)}
.tag i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.tag.lg{height:38px;padding:0 14px;font-size:17px;border-radius:10px}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.ok i{background:var(--ok-dot)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.crit{background:var(--crit-bg);color:var(--crit)}
.tag.blue{background:var(--blue-100);color:var(--blue-ink)}
.tag.plain{background:var(--card);border:1px solid var(--line);color:var(--ink-2);font-weight:500}
.tag.live i{position:relative}
.tag.live i::after{content:"";position:absolute;inset:0;border-radius:50%;background:currentColor;animation:ping 1.8s ease-out infinite}
@keyframes ping{to{transform:scale(2.4);opacity:0}}

/* 아이콘 칸 */
.ico{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;flex:none;background:var(--blue-100);color:var(--blue)}
.ico svg{width:18px;height:18px}
.ico.sm{width:28px;height:28px;border-radius:8px}
.ico.sm svg{width:15px;height:15px}

/* 제목 줄 */
.ptitle{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:28px 2px 16px}
.ptitle h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.ptitle p{margin:2px 0 0;color:var(--ink-2);font-size:15px}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.seg button{height:34px;padding:0 14px;border:0;border-radius:9px;background:none;font-size:15px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--blue-100);color:var(--blue-ink)}
.seg-wrap{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-3)}
.ptitle .seg-wrap + .seg-wrap{margin-left:-4px}

main{display:flex;flex-direction:column;gap:16px}
.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 1px 2px rgba(27,42,65,.04),0 10px 26px -18px rgba(27,42,65,.22)} /* 큰 카드에만 아주 옅은 그림자 — 흰 바탕 위에서 층이 생기게 */
.ch{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ch h2{margin:0;font-size:18px;font-weight:700}
.ch .sub{font-size:15px;color:var(--ink-3)}
.ch .end{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* 머리 카드 */
/* 결론 = 상태와 출하 여부 두 개만 크게. 나머지(작업지시 · 원자재 · 판정 수 · 불합격)는 회색 글자 */
.head-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.head-tags{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag.xl{height:44px;padding:0 18px;border-radius:12px;font-size:20px;font-weight:700;gap:8px}
.tag.xl i{width:10px;height:10px}
.tag.xl svg{width:18px;height:18px}
.tag.out{background:var(--card);box-shadow:inset 0 0 0 1.5px currentColor} /* 출하 여부 = 테두리만 — 상태(합격)와 같은 모양이 반복되지 않게 */
.lotno{margin:18px 0 8px;font-size:42px;font-weight:700;line-height:1.1;letter-spacing:-.03em}
.facts{display:flex;flex-wrap:wrap;gap:4px 22px;margin:0;font-size:15px;color:var(--ink-2)}
.facts span{white-space:nowrap}
.facts em{font-style:normal;color:var(--ink-3);margin-right:6px}
.live{font-size:14px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok-dot)}

/* 공정 길: 다섯 칸을 가는 선으로 잇는다 — 이 화면에서 유일하게 눈에 띄는 장치 */
.route{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:24px}
.route::before{content:"";position:absolute;left:28px;right:28px;top:41px;height:2px;background:repeating-linear-gradient(90deg,var(--blue-200) 0 6px,transparent 6px 11px)}
.stop{position:relative;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.stop .r1{display:flex;align-items:center;gap:10px}
.stop .ico{width:44px;height:44px;border-radius:12px;box-shadow:0 0 0 5px var(--card)}
.stop .ico svg{width:20px;height:20px}
.stop .nm{font-size:17px;font-weight:700;line-height:1.25}
.stop .cd{font-size:14px;color:var(--ink-3)}
.stop .r2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stop .tag{height:26px;font-size:14px;padding:0 9px}
.thin{height:5px;border-radius:999px;background:var(--line-2);overflow:hidden}
.thin b{display:block;height:100%;border-radius:999px}
/* 다 끝난 로트: 공정 길을 한 줄 띠로 줄인다 (카드 5장이 모두 '완료'로 반복되지 않게) */
.route-done{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:22px;padding:12px 16px;border:1px solid var(--line);border-radius:14px}
.mini{display:flex;align-items:center;flex-wrap:wrap;gap:8px 0;margin:0;padding:0;list-style:none}
.mini li{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;white-space:nowrap}
.mini li + li::before{content:"";width:26px;height:2px;margin:0 10px;background:repeating-linear-gradient(90deg,var(--blue-200) 0 4px,transparent 4px 7px)}
.mini li small{font-size:13px;font-weight:500;color:var(--ink-3)}

/* 찾기 · 계보 */
.find{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search{position:relative;width:min(340px,100%)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{width:100%;height:46px;padding:0 12px 0 40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px}
.search input:focus{outline:none;border-color:var(--blue-200);box-shadow:0 0 0 3px var(--blue-50)}
.search input::placeholder{color:var(--ink-3)}
.btn{height:46px;padding:0 22px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:16px;font-weight:700}
.btn:hover{background:var(--blue-ink)}
.ex{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px;color:var(--ink-3);margin-left:6px}
.ex button{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:14px;color:var(--ink-2)}
.ex button:hover{border-color:var(--blue-200);color:var(--blue-ink)}
.tree{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:18px;border-top:1px solid var(--line-2)}
.mat{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:12px;border:1px solid var(--line)}
.mat small{display:block;font-size:13px;color:var(--ink-3);line-height:1.2}
.mat b{font-size:16px}
.join{width:20px;height:2px;background:var(--line)}
.lot{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:600}
.lot i{width:8px;height:8px;border-radius:50%;background:var(--ok-dot)}
.lot.run i{background:var(--blue)}
.lot.run{border-style:dashed}
.lot[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-100);color:var(--blue-ink);font-weight:700;box-shadow:inset 0 0 0 1px var(--blue),0 4px 12px -6px rgba(61,111,224,.5)}
.lot[aria-pressed="true"]::after{content:"보는 중";margin-left:2px;padding:1px 7px;border-radius:6px;background:var(--card);color:var(--blue-ink);font-size:12px;font-weight:600}
.tree-note{margin-top:10px;font-size:14px;color:var(--ink-3)}

/* 설비별 시간표 */
.legend{display:flex;flex-wrap:wrap;gap:6px}
.tlwrap{overflow-x:auto}
.tl{position:relative;min-width:880px}
.grid{display:grid;grid-template-columns:176px minmax(0,1fr)}
.axis{position:relative;height:30px;font-size:14px;color:var(--ink-3)}
.axis span{position:absolute;top:2px;transform:translateX(-50%);white-space:nowrap}
.axis span:first-child{transform:none}
.eq{height:58px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--line-2)}
.eq b{display:block;font-size:16px;line-height:1.2}
.eq small{font-size:13px;color:var(--ink-3)}
.lane{position:relative;height:58px;border-top:1px solid var(--line-2)}
.vl{position:absolute;top:0;bottom:0;width:1px;background:var(--line-2)}
.job{position:absolute;top:13px;height:32px;border-radius:8px;font-size:14px;font-weight:600;line-height:32px;padding:0 10px;white-space:nowrap;overflow:hidden;transform-origin:left;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.alarm{position:absolute;top:0;bottom:0;background:var(--crit-bg);border-top:2px solid var(--crit-b)}
.alarm .tag{position:absolute;left:4px;bottom:2px;height:20px;font-size:12px;padding:0 6px;border-radius:5px;background:var(--card)}
.now{position:absolute;top:30px;bottom:0;width:2px;background:var(--ink);pointer-events:none}
.now span{position:absolute;top:-30px;right:-1px;padding:1px 9px;border-radius:7px;background:var(--ink);color:#fff;font-size:13px;font-weight:600;white-space:nowrap}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* 수량 · 보류 */
.two{display:grid;grid-template-columns:1.15fr 1fr;gap:16px}
.q{display:grid;grid-template-columns:168px minmax(0,1fr) 100px;gap:16px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2)}
.q:first-of-type{border-top:0}
.q > span{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;white-space:nowrap}
.qbar{display:flex;gap:2px;height:10px;border-radius:999px;background:var(--line-2);overflow:hidden}
.qbar b{display:block;height:100%}
.q .v{text-align:right}
.q .v b{font-size:20px}
.q .v small{display:block;font-size:13px;color:var(--ink-3)}
.hold{display:flex;gap:8px;flex-wrap:wrap}
.hold input{height:44px;flex:1 1 200px;min-width:0;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px}
.hold button{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px;font-weight:600;color:var(--ink-3)}
.scrap{margin-top:16px;padding-top:16px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.soft-btn{height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--blue-200);background:var(--blue-50);color:var(--blue-ink);font-size:16px;font-weight:700}
.soft-btn:hover{background:var(--blue-100)}
.ghost{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:600;color:var(--ink-2)}
.ghost:hover{border-color:var(--blue-200);color:var(--blue-ink)}
.muted{font-size:14px;color:var(--ink-3)}

/* 색 규칙표 */
.rules p{margin:0 0 16px;color:var(--ink-2);font-size:15px;max-width:72ch}
.rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.rg h3{margin:0 0 8px;font-size:15px;font-weight:700}
.sw{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line-2)}
.sw i{width:36px;height:28px;border-radius:8px;border:1px solid rgba(27,42,65,.08)}
.sw b{font-size:15px;display:block;line-height:1.3}
.sw small{font-size:13px;color:var(--ink-2);display:block;line-height:1.3}
.sw code{font-size:13px;color:var(--ink-3);font-family:inherit}

@media (prefers-reduced-motion:reduce){.job,.tag.live i::after{animation:none}}
@media (max-width:1100px){.two{grid-template-columns:minmax(0,1fr)}.who{display:none}}
@media (max-width:820px){.route{grid-template-columns:repeat(5,minmax(160px,1fr));overflow-x:auto;padding-bottom:4px}.route::before{display:none}.lotno{font-size:32px}.clock b:first-child{display:none}.q{grid-template-columns:142px minmax(0,1fr) 112px;gap:10px}.q > span{font-size:15px}}

/* ───── 다른 화면 공통 조각 — 로트 추적과 같은 말투 (흰 칸 · 옅은 파랑 고르기 · 상태는 태그) ───── */
:root{--point:var(--blue);--point-ink:var(--blue-ink);--point-tint:var(--blue-100);--point-soft:var(--blue-200);--t2:var(--ink-2);--t3:var(--ink-2);--t4:var(--ink-3);--warn-t:var(--warn);--warn-line:#f6d6a8;--ok-t:var(--ok);--crit-t:var(--crit);--ph:#9aa7b8;--panel:#fff;--fs-band:20px}
header.bar nav{overflow:visible}
.grp{position:relative}
@media (max-width:1100px){.nav .nl,.nav small{display:none}.nav{padding:0 10px}}
.nav small{font-size:11px;opacity:.6}
.drop{position:absolute;left:0;top:46px;z-index:40;min-width:190px;display:flex;flex-direction:column;gap:2px;padding:6px;border-radius:14px;border:1px solid var(--line);background:var(--card);box-shadow:0 14px 32px -16px rgba(27,42,65,.3)}
.drop button{height:40px;padding:0 12px;border:0;border-radius:9px;background:none;text-align:left;font-size:15px;font-weight:500;color:var(--ink)}
.drop button:hover{background:var(--blue-50)}
.drop button.sel{background:var(--blue-100);color:var(--blue-ink);font-weight:600}
main.pg{display:flex;flex-direction:column;gap:16px}
.cols{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))} .c21{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)} .c12{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.side-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
.htitle{margin:16px 0 6px;font-size:30px;font-weight:700;line-height:1.25;letter-spacing:-.02em}
.facts b{color:var(--ink);font-weight:600}
.facts .long{white-space:normal}
#view{display:flex;flex-direction:column;gap:16px}
#view > .ptitle{margin-bottom:0}
#view > .foot{margin-top:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:20px}
.kpi{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .lb{font-size:14px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-size:26px;font-weight:700;line-height:1.2}
.kpi .v small{font-size:14px;font-weight:500;color:var(--ink-3);margin-left:4px}
.kpi .n{font-size:14px;color:var(--ink-2)}
.kpi .n.warn{align-self:flex-start;padding:0 8px;border-radius:6px;background:var(--warn-bg);color:var(--warn);font-weight:600}
.kpi .thin{margin-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips .lab{font-size:14px;color:var(--ink-3);margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:15px;color:var(--ink-2);white-space:nowrap}
.chip:hover{border-color:var(--blue-200);color:var(--blue-ink)}
.chip.sel{background:var(--blue-100);border-color:var(--blue-200);color:var(--blue-ink);font-weight:600}
.chip b{font-weight:600}
.chip .w{color:var(--warn);font-weight:600}
.tabs{display:inline-flex;padding:3px;border-radius:12px;background:var(--card);border:1px solid var(--line);max-width:100%;overflow-x:auto}
.tabs button{height:34px;padding:0 14px;border:0;border-radius:9px;background:none;font-size:15px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tabs button.sel{background:var(--blue-100);color:var(--blue-ink)}
.segs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.side{padding:10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:86px}
.side .grp-t{padding:8px 10px 6px;font-size:14px;color:var(--ink-3)}
.side button{display:flex;align-items:center;justify-content:space-between;height:42px;padding:0 12px;border:0;border-radius:10px;background:none;font-size:15px;text-align:left}
.side button:hover{background:var(--blue-50)}
.side button.sel{background:var(--blue-100);color:var(--blue-ink);font-weight:600}
.cnt{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--blue-100);color:var(--blue-ink);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.side button.sel .cnt{background:var(--card)}
.meters{display:flex;flex-direction:column}
.meter{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr) 120px;gap:16px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2)}
.meter:first-child,.grp-h + .meter{border-top:0}
.meter .nm{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter .nm small{display:block;font-size:13px;font-weight:400;color:var(--ink-3)}
.meter .nm .w{display:inline-flex;margin-right:6px;padding:0 6px;border-radius:5px;background:var(--warn-bg);color:var(--warn);font-size:12px;font-weight:600;vertical-align:2px}
.mbar{position:relative;height:10px;border-radius:999px;background:var(--line-2)}
.mbar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--blue-200)}
.mbar i.warn{background:#f3c98a}
.mbar .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-2);border-radius:1px}
.meter .v{text-align:right;font-size:16px;font-weight:600}
.meter .v small{font-size:13px;font-weight:400;color:var(--ink-3)}
.grp-h{display:flex;align-items:baseline;gap:10px;margin:16px 0 2px;font-size:15px;font-weight:700}
.grp-h:first-child{margin-top:0}
.grp-h small{font-size:13px;font-weight:400;color:var(--ink-3)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;font-weight:600;color:var(--ink-3);padding:0 12px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td small{display:block;font-size:13px;color:var(--ink-3);margin-top:2px}
tbody tr.go{cursor:pointer}
tbody tr.go:hover td{background:var(--blue-50)}
.plus{color:var(--ok);font-weight:600} .minus{color:var(--ink-2);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:7px;font-size:13px;font-weight:600;white-space:nowrap;background:#f1f4f8;color:var(--ink-2)}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.crit{background:var(--crit-bg);color:var(--crit)} .badge.live{background:var(--blue-100);color:var(--blue-ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.minibar{display:flex;align-items:center;gap:10px}
.minibar i{display:block;height:8px;border-radius:999px;background:var(--blue-200)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{border-radius:12px;border:1px solid var(--line);background:var(--card);padding:12px 14px}
.tile small{display:block;font-size:13px;color:var(--ink-3)}
.tile b{font-size:24px;font-weight:700}
.tile em{display:inline-flex;margin-top:4px;padding:0 8px;border-radius:6px;font-style:normal;font-size:13px;background:#f1f4f8;color:var(--ink-2)}
.tile.warn em{background:var(--warn-bg);color:var(--warn);font-weight:600}
.btn-p{height:42px;padding:0 18px;border:0;border-radius:11px;background:var(--blue);color:#fff;font-size:15px;font-weight:700;white-space:nowrap}
.btn-p:hover{background:var(--blue-ink)}
.empty{margin:0;color:var(--ink-3)}
.note{font-size:14px;color:var(--ink-3);margin:12px 0 0}
.legend span{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2)}
.legend i{display:inline-block;width:16px;height:10px;border-radius:3px}
.legend:not(.end){display:flex;flex-wrap:wrap;gap:6px 14px}
.pmap{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:5px}
.pmap span{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--card);border:1px solid var(--line);color:var(--ink-3)}
.pmap .ok{background:var(--blue-100);border-color:var(--blue-200);color:var(--blue-ink)}
.pmap .cur{border:2px solid var(--blue);color:var(--blue-ink)}
.pmap .no{border-style:dashed;color:#c3ccd8}
.tol{display:grid;grid-template-columns:130px minmax(0,1fr) 90px;gap:14px;align-items:center;padding:9px 0;border-top:1px solid var(--line-2)}
.tol:first-child{border-top:0}
.tol .tb{position:relative;height:24px}
.tol .tb::before{content:"";position:absolute;left:0;right:0;top:10px;height:3px;border-radius:2px;background:var(--line-2)}
.tol .tb .z{position:absolute;top:8px;height:7px;border-radius:4px;background:var(--blue-100)}
.tol .tb .p{position:absolute;top:4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px var(--card)}
.tol .tb .lim{position:absolute;top:22px;font-size:11px;color:var(--ink-3);transform:translateX(-50%)}
.tol .v{text-align:right;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .wd{text-align:center;font-size:13px;color:var(--ink-3);padding-bottom:2px}
.cal .d{min-height:60px;border-radius:10px;background:var(--card);border:1px solid var(--line-2);padding:5px 7px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.cal .d.blank{border:0}
.cal .d.today{border:2px solid var(--blue)}
.cal .d b{font-weight:600;color:var(--ink-2)}
.cal .d .k{align-self:flex-start;padding:0 7px;border-radius:6px;background:var(--blue-100);color:var(--blue-ink);font-weight:600}
.cal .d .k.warn{background:var(--warn-bg);color:var(--warn)}
.tasks{display:flex;flex-direction:column;gap:14px}
.tasks .eqh{font-weight:700;margin-bottom:6px}
.tasks ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.tasks li{display:flex;gap:10px;align-items:center;padding:7px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:15px}
.tasks li i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--blue-50);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ink-2);flex:none}
.tasks li.warn i{background:var(--warn-bg);color:var(--warn)}
.chart svg{display:block;width:100%;height:auto}
.eqcards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}

  const t = e.target.closest('[data-toast]'); if (t) return toast(t.dataset.toast);
  const sb = e.target.closest('.chip,.tabs button,.side button');
  if (sb) { sb.parentElement.querySelectorAll('.sel').forEach((x) => x.classList.remove('sel')); sb.classList.add('sel'); }
  if (open && !e.target.closest('.grp')) { open = null; renderMenu(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && open) { open = null; renderMenu(); } });
go(screen);
</script>
