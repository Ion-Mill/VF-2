<title>로트 추적 글꼴 비교</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 위 가로 메뉴 → 제목 줄(예시 로트 고르기) → 머리 카드(상태 태그 · 로트 번호 · 공정 길) → 찾기·계보 → 설비별 시간표 → 수량 | 보류·폐기 → 색 규칙표.
   규칙: 카드는 전부 흰색 + 얇은 선. 색은 아이콘 칸과 태그에만, 파랑 계열 파스텔로 살짝. 꽉 찬 색은 '찾기' 버튼 하나. 상태색(초록·주황·빨강)은 태그 안에서만.
   공정 5색은 파랑 집안 안에서 색 간격을 벌려 이웃 공정끼리 번갈아 다르게(청록 · 파랑 · 보라 · 회청 · 하늘). 초록·주황·빨강과는 안 겹친다. 밝은 테마 하나로 고정(앱이 밝은 화면만 씀) */
:root{
  color-scheme:light;
  --ground:#f5f8fc;              /* 화면 바탕: 아주 옅은 하늘빛 흰색 */
  --card:#ffffff;                /* 카드: 무조건 흰색 */
  --line:#e3e9f2; --line-2:#edf1f7;
  --ink:#1b2a41; --ink-2:#56667d; --ink-3:#7d8ca1;
  --blue:#3d6fe0; --blue-ink:#2a55b8; --blue-50:#f2f7ff; --blue-100:#e5effe; --blue-200:#cbdcfb;
  /* 공정 색 (칸 바탕 / 아이콘 / 막대 / 막대 글자) */
  --op1:#dff3f7; --op1-i:#0f8299; --op1-b:#c2e7ef; --op1-t:#0a5a6b; /* 청록 */
  --op2:#e6eefe; --op2-i:#3a6fe0; --op2-b:#cfdcfb; --op2-t:#234fae; /* 파랑 */
  --op3:#f0e9fd; --op3-i:#7b4fe0; --op3-b:#e0d1fb; --op3-t:#5532b6; /* 보라 */
  --op4:#eceff4; --op4-i:#57677e; --op4-b:#d6dde7; --op4-t:#344157; /* 회청 */
  --op5:#e3f3fd; --op5-i:#1f8ad2; --op5-b:#c4e4f9; --op5-t:#135f96; /* 하늘 */
  /* 상태 태그 */
  --ok:#157a4f; --ok-bg:#e6f6ef; --ok-dot:#2bb673;
  --warn:#a35a0c; --warn-bg:#fff3e3;
  --crit:#c23042; --crit-bg:#fdecee; --crit-b:#f6c9cf;
  --font:"Pretendard Variable","Pretendard",system-ui,"Malgun Gothic",sans-serif;
}

/* 한글 제목은 자간을 살짝 줄인다 */
h1,h2,.lotno{letter-spacing:-.02em}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;word-break:keep-all;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue-200);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.page{padding-block:12px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1360px;margin:0 auto}

/* 위 가로 메뉴: 흰 바, 선택 메뉴는 옅은 파랑 칸 + 파랑 글자 */
.bar{position:sticky;top:calc(10px + env(safe-area-inset-top,0px));z-index:30;display:flex;align-items:center;gap:4px;height:60px;padding:0 16px 0 18px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;flex:none}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--blue-100);display:grid;place-items:center;color:var(--blue);font-style:normal;font-size:14px;font-weight:700}

.tag{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:8px;font-size:15px;font-weight:600;white-space:nowrap;background:var(--blue-50);color:var(--ink-2)}

.tag.crit{background:var(--crit-bg);color:var(--crit)}

main{display:flex;flex-direction:column;gap:16px}
.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 1px 2px rgba(27,42,65,.04),0 10px 26px -18px rgba(27,42,65,.22)} /* 큰 카드에만 아주 옅은 그림자 — 흰 바탕 위에서 층이 생기게 */

  ['OP-10','SAW-01','절단','op1','<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/>'],

  ['OP-30','VF2-01/02','정밀 가공','op3','<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/>'],
  ['OP-40','WSH-01','디버링·세척','op4','<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>'],
  ['OP-50','CMM-01','측정','op5','<path d="M3 17 17 3l4 4L7 21zM7 13l2 2M10 10l2 2M13 7l2 2"/>']];
const EQS = [['SAW-01',0],['MIL-01',1],['VF2-01',2],['VF2-02',2],['WSH-01',3],['CMM-01',4]];
const LOTS = {
  done:{no:'LOT-2610-001-1',po:'PO-2610-001',shift:'10/1 주간 투입',tag:['ok','합격'],note:'OP-50 판정 24 / 24',side:['plain','불합격 1개 폐기 대기'],ship:true,
    done:[24,24,24,24,24],input:24,pass:23,fail:1,fg:23,shipped:0,shipSub:'출하 가능',
    jobs:{'SAW-01':[['15:20','17:10','24개']],'MIL-01':[['16:10','17:10','15개'],['17:10','20:10','9개']],'VF2-01':[['17:30','21:20','12개']],'VF2-02':[['18:00','21:40','12개']],'WSH-01':[['19:00','22:30','24개']],'CMM-01':[['19:40','23:10','24개']]},
    alarm:['VF2-01','19:10','19:40','알람 174']},
  run:{no:'LOT-2610-002-1',po:'PO-2610-002',shift:'10/1 야간 투입',tag:['blue live','생산 중'],note:'OP-50 판정 9 / 24',side:null,ship:false,
    done:[24,24,24,17,9],input:24,pass:9,fail:0,fg:9,shipped:0,shipSub:'출하 금지',
    jobs:{'SAW-01':[['17:20','19:00','24개']],'MIL-01':[['18:10','21:40','24개']],'VF2-01':[['19:30','23:50','12개']],'VF2-02':[['20:00','00:40','12개']],'WSH-01':[['21:30','01:57','17개']],'CMM-01':[['22:40','01:57','9개']]},
    alarm:['VF2-02','23:10','23:55','고장 966']}
};
const T0 = 15*60, TOT = 660; // 10/1 15:00 ~ 10/2 02:00
const m = s => { const [h,mi] = s.split(':').map(Number); return (h*60+mi-T0+1440)%1440; };
const pct = v => `${v/TOT*100}%`;
const LOCK = P('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>');
const ico = (k, cls='') => `<span class="ico ${cls}" style="background:var(--${k});color:var(--${k}-i)">`;

function draw(k){
  const L = LOTS[k];
  document.getElementById('head').innerHTML = `
    <div class="head-top">
      <div class="head-tags"><span class="tag xl ${L.tag[0]}"><i></i>${L.tag[1]}</span>${L.ship?'<span class="tag xl ok out"><i></i>출하 가능</span>':`<span class="tag xl warn out">${LOCK}출하 금지</span>`}</div>
      <span class="live num"><i></i>실시간, 10/2 01:57 기준</span>
    </div>
    <div class="lotno num">${L.no}</div>
    <p class="facts"><span><em>작업지시</em><span class="num">${L.po}</span></span><span><em>원자재</em><span class="num">MAT-2609-11</span></span><span><em>투입</em>${L.shift.replace(' 투입','')}</span><span><em>OP-50 판정</em><span class="num">${L.note.replace('OP-50 판정 ','')}</span></span>${L.side?`<span><em>불합격</em>${L.side[1].replace('불합격 ','')}</span>`:''}</p>
    ${L.done.every(n=>n>=L.input) ? `<div class="route-done"><span class="tag ok"><i></i>공정 5단계 모두 완료</span><ol class="mini">${OPS.map(([op,,name,c,d]) => `<li>${ico(c,'sm')}${P(d)}</span>${name}<small class="num">${op}</small></li>`).join('')}</ol></div>` :
    `<div class="route">${OPS.map(([op,eq,name,c,d],i) => { const n=L.done[i], full=n>=L.input;
      return `<div class="stop"><div class="r1">${ico(c)}${P(d)}</span><div><div class="nm">${name}</div><div class="cd num">${op} · ${eq}</div></div></div>
        <div class="r2"><span class="tag num ${full?'':n?'blue':''}" style="${full?`background:var(--${c});color:var(--${c}-t)`:''}">${full?'완료':n?`${n} / ${L.input}`:'대기'}</span><span class="muted num">${full?`${n}개`:''}</span></div>
        <div class="thin"><b style="width:${n/L.input*100}%;background:var(--${c}-i);opacity:.55"></b></div></div>`; }).join('')}</div>`}`;

  const tree = [['LOT-2609-128-3',0],['LOT-2609-129-1',0],['LOT-2610-001-1',0],['LOT-2610-001-2',0],['LOT-2610-002-1',1]];
  document.getElementById('tree').innerHTML = `<div class="mat"><span class="ico sm">${P('<path d="M4 7h16M4 12h16M4 17h16"/>')}</span><div><small>원자재</small><b class="num">MAT-2609-11</b></div></div><span class="join"></span>` +
    tree.map(([no,run]) => `<button class="lot num ${run?'run':''}" aria-pressed="${no===L.no}" title="${run?'생산 중':'합격'}"><i></i>${no}</button>`).join('');

  document.getElementById('tlsub').textContent = L.no;
  // 공정 이름은 각 줄 왼쪽에 이미 있으므로 범례는 알람만
  document.getElementById('legend').innerHTML = '<span class="tag crit" style="height:28px;font-size:14px">알람 구간</span>';
  const ticks = [0,2,4,6,8,10].map(i=>i*60);
  const lab = t => { const h=(15+t/60)%24; return (t===0?'10/1 ':t===540?'10/2 ':'')+String(h).padStart(2,'0')+':00'; };
  const vl = ticks.map(t=>`<div class="vl" style="left:${pct(t)}"></div>`).join('');
  let h = `<div class="grid"><div></div><div class="axis">${ticks.map(t=>`<span class="num" style="left:${pct(t)}">${lab(t)}</span>`).join('')}</div>`;
  EQS.forEach(([eq,oi],i) => {
    const [op,,name,c,d] = OPS[oi];
    const al = L.alarm[0]===eq ? `<div class="alarm" style="left:${pct(m(L.alarm[1]))};width:${pct(m(L.alarm[2])-m(L.alarm[1]))}"><span class="tag crit">${L.alarm[3]}</span></div>` : '';
    h += `<div class="eq">${ico(c,'sm')}${P(d)}</span><div><b class="num">${eq}</b><small>${op} ${name}</small></div></div><div class="lane">${vl}${al}${(L.jobs[eq]||[]).map(([s,e,t],j)=>`<div class="job num" style="left:${pct(m(s))};width:calc(${pct(m(e)-m(s))} - 3px);background:var(--${c}-b);color:var(--${c}-t);animation-delay:${.05+i*.05+j*.04}s">${L.no.slice(-5)}, ${t}</div>`).join('')}</div>`;
  });
  h += `</div><div class="now" style="left:calc(176px + (100% - 176px) * ${m('01:57')/TOT})"><span class="num">지금 01:57</span></div>`;
  document.getElementById('tl').innerHTML = h;

  const seg = (v,c) => v>0 ? `<b style="width:${v/L.input*100}%;background:${c}"></b>` : '';
  const BLUE = 'var(--blue-200)';
  document.getElementById('qty').innerHTML = [
    ['op1','<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>','투입', seg(L.input,BLUE), `${L.input}`, ''],
    ['op3','<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>','OP-50 판정', seg(L.pass,BLUE)+seg(L.fail,'var(--crit-b)'), `${L.pass+L.fail} / ${L.input}`, `합격 ${L.pass}, 불합격 ${L.fail}`],
    ['op5','<path d="M3 9h18l-2-5H5zM5 9v11h14V9M9 20v-6h6v6"/>','완제품 입고', seg(L.fg,BLUE), `${L.fg}`, ''],
    ['op4','<path d="M3 6h11v10H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>','출하', seg(L.shipped,BLUE), `${L.shipped}`, L.shipSub]
  ].map(([c,d,l,bar,n,s]) => `<div class="q"><span><span class="ico sm">${P(d)}</span>${l}</span><div class="qbar">${bar}</div><div class="v num"><b>${n}</b>${s?`<small>${s}</small>`:''}</div></div>`).join('');

  document.getElementById('hsub').textContent = L.no;
  document.getElementById('hold').innerHTML = `<div class="hold"><input id="reason" placeholder="보류 사유를 적어 주세요" aria-label="보류 사유"><button disabled>${L.ship?'판정이 끝나 보류할 수 없음':'보류'}</button></div>` +
    (L.fail ? `<div class="scrap"><button class="soft-btn">불합격 ${L.fail}개 폐기 결재 요청</button><span class="muted">결재 요청 전입니다. 관리자가 승인하면 폐기됩니다.</span></div>`
            : `<div class="scrap"><span class="muted">폐기할 불합격품이 없습니다.</span></div>`);
  document.querySelectorAll('.seg button[data-k]').forEach(b => b.setAttribute('aria-pressed', b.dataset.k===k));
}
document.getElementById('fontseg').addEventListener('click', e => { const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.f==='pre') delete document.documentElement.dataset.font; else document.documentElement.dataset.font=b.dataset.f;
  document.querySelectorAll('#fontseg button').forEach(x => x.setAttribute('aria-pressed', x===b)); });
document.querySelector('.seg:not(#fontseg)').addEventListener('click', e => { const b=e.target.closest('button'); if(b) draw(b.dataset.k); });
draw('done');

// 색 규칙표 — CSS 변수 값을 그대로 읽어 보여 줌
const css = getComputedStyle(document.documentElement), v = n => css.getPropertyValue(n).trim();
const RULES = [
  ['바탕과 카드',[['--ground','화면 바탕','아주 옅은 하늘빛 흰색'],['--card','카드','모든 카드 · 칸 · 입력칸'],['--line','선','카드 테두리'],['--ink','글자','제목 · 숫자'],['--ink-2','보조 글자','설명'],['--ink-3','흐린 글자','코드 · 눈금']]],
  ['포인트 파랑',[['--blue','파랑','찾기 버튼 하나만 꽉 찬 색'],['--blue-100','옅은 파랑','선택 메뉴 · 아이콘 칸 · 진행 태그'],['--blue-50','더 옅은 파랑','선택한 로트 · 보조 버튼'],['--blue-200','파랑 선','수량 막대 · 포커스']]],
  ['공정 색 (이웃 공정끼리 번갈아)',[['--op1-i','청록','OP-10 절단'],['--op2-i','파랑','OP-20 황삭'],['--op3-i','보라','OP-30 정밀 가공'],['--op4-i','회청','OP-40 디버링·세척'],['--op5-i','하늘','OP-50 측정']]],
  ['상태 태그 (태그 안에서만)',[['--ok-bg','정상','합격 · 출하 가능'],['--warn-bg','주의','출하 금지 · 결정 필요'],['--crit-bg','긴급','알람 · 불합격']]]
];
document.getElementById('rules').innerHTML = RULES.map(([g,rows]) => `<div><h3>${g}</h3>${rows.map(([n,name,use]) =>
  `<div class="sw"><i style="background:var(${n})"></i><div><b>${name}</b><small>${use}</small></div><code>${v(n)}</code></div>`).join('')}</div>`).join('');
</script>
