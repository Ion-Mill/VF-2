# AWS 서버(리눅스+도커) 한 대에서 전체를 켠다. 사용: ./mom.sh up   (배포_안내.md)
# 바깥에는 caddy 만 열린다 (80·443). 나머지는 도커 안쪽 네트워크로만 서로 부른다.
# 비밀 값은 이 폴더의 backend.env · assistant.env · .env 에 서버에서 직접 넣는다 (저장소에 없음, *.example 참고)
name: mom
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?.env 에 DOMAIN 필요}
      BASIC_USER: ${BASIC_USER:?.env 에 BASIC_USER 필요}
      BASIC_HASH: ${BASIC_HASH:?.env 에 BASIC_HASH 필요}
      GATE_TOKEN: ${GATE_TOKEN:?.env 에 GATE_TOKEN 필요}   # 접속 통과 쿠키 값 (Caddyfile)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, sim, backend]

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    expose: ["3000"]

  sim:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.sim
      args:
        BUILD_PROFILE: ${MOM_PROFILE:-final}
    restart: unless-stopped
    expose: ["8765"]
    environment:
      MOM_PROFILE: ${MOM_PROFILE:-final}
      MOM_ASSISTANT_URL: http://assistant:8100
      MOM_LLM_COMPOSE: ${MOM_LLM_COMPOSE:-0}
      MOM_PRESENTER_KEY: ${MOM_PRESENTER_KEY:-}   # 최종용에서 처음으로를 부를 때 필요한 발표자 키 (비어 있으면 거절)
      MOM_PRETEND_NOW: ${MOM_PRETEND_NOW:-}       # 리허설용: 예) 2026-10-26T17:00 이면 그 시각에서 흐르는 것처럼. 발표 때는 비워 둔다
      # DB 중계 (2026-10-25): 화면은 백엔드 → DB를 읽으므로, 시연 서버의 실시간 기록을 백엔드 받는 곳(/api/ingest/*)으로 보낸다.
      #   켤 때 한 번 공용 DB를 시연 기준점으로 되돌린 뒤 지금까지 따라잡는다 ("DB 1개 = 공장 1개", frontend/tools/db_relay.py)
      MOM_DB_RELAY_URL: http://backend:8000
      MOM_INGEST_KEY: ${MOM_INGEST_KEY:?.env 에 MOM_INGEST_KEY 필요}
    depends_on:
      backend:
        condition: service_healthy   # 중계는 켤 때 백엔드가 응답하지 않으면 스스로 꺼진다 — 백엔드가 뜬 뒤에 켠다
    volumes:
      - sim_live:/app/데이터생성기/out_live            # 최종용의 사람 조작·회차 번호 (서버를 다시 켜도 같은 세계)
    env_file:
      - path: assistant.env        # MOM_ASSISTANT_KEY 만 쓴다 (문장 다듬기용)
        required: false

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    expose: ["8000"]
    # 공용 DB(Supabase)를 쓰므로 이미지의 시작 스크립트(빈 DB에 데이터 적재)는 건너뛴다 — 공용 DB에 적재가 돌지 않게
    entrypoint: []
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: backend.env
    # 아래 값은 backend.env 보다 앞선다. 시연 서버와 같아야 하는 키는 .env 한 곳에서 받는다
    environment:
      MOM_ASSISTANT_URL: http://assistant:8100
      MOM_SIM_URL: http://sim:8765                          # 공구 교체·로트 보류·[처음으로] 등 시연 조작을 시연 서버로 넘김
      MOM_SIM_SYNC: ${MOM_SIM_SYNC:-true}                   # 시연 서버 중계를 받음 (끄면 화면이 DB의 멈춘 상태만 보임)
      MOM_INGEST_KEY: ${MOM_INGEST_KEY:?.env 에 MOM_INGEST_KEY 필요}
      MOM_PRESENTER_KEY: ${MOM_PRESENTER_KEY:-}
      MOM_SIM_CONTROL_USERS: ${MOM_SIM_CONTROL_USERS:-}     # 비우면 로그인한 누구나 [처음으로]를 부를 수 있다 — 발표자만 넣는다
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s

  assistant:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.assistant
    restart: unless-stopped
    expose: ["8100"]
    env_file: assistant.env
    environment:
      MOM_BACKEND_URL: http://backend:8000
      SIM_SERVER_URL: http://sim:8765
    volumes:
      - whisper_models:/models

volumes:
  sim_live:
  caddy_data:
  caddy_config:
  whisper_models:
