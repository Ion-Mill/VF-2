<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SCR-19 배치 A 상태판형</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#ECEFF4}
a{color:#1F5FBF}a:hover{color:#174A96}
button,select,input{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #1F5FBF;outline-offset:2px}
@keyframes dcRise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes dcPulse{0%{box-shadow:0 0 0 0 rgba(31,95,191,.5)}70%{box-shadow:0 0 0 9px rgba(31,95,191,0)}100%{box-shadow:0 0 0 0 rgba(31,95,191,0)}}
section{box-shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.05);animation:dcRise .35s ease-out both}
button,a{transition:background-color .15s,box-shadow .15s,transform .08s,filter .15s}
button:not(:disabled):not([style*="transparent"]):hover{filter:brightness(.96);box-shadow:0 3px 10px rgba(31,95,191,.20)}
header button:not(:disabled):hover{background:rgba(255,255,255,.22)!important;filter:none;box-shadow:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="min-height: 100vh; background: #ECEFF4; color: #1B1F24; font-family: 'IBM Plex Sans KR', sans-serif; font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; display: flex; flex-direction: column;">

<header style="background: #1B2A47; color: #FFFFFF; box-shadow: 0 2px 10px rgba(16,24,40,0.20);">
<div style="max-width: 1440px; margin: 0 auto; padding: 6px 20px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;">
<button aria-label="메뉴" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.30); border-radius: 8px; color: #FFFFFF; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
<span style="font-weight: 700; font-size: 19px;">로트 추적</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: #CFDBEE;">10/1 (목) 주간 08:00~17:00 · 13:40</span>
<span style="flex: 1 1 auto;"></span>
<span style="font-weight: 600;">반장(SUP) 박○○</span>
<button aria-label="처리 안 된 알림 4건" style="min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.30); border-radius: 8px; color: #FFFFFF; font-size: 15px; cursor: pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10 21a2 2 0 0 0 4 0"></path></svg>미처리 4</button>
<button style="min-height: 44px; padding: 0 14px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.30); border-radius: 8px; color: #FFFFFF; font-size: 15px; cursor: pointer;">비서</button>
<button style="min-height: 44px; padding: 0 14px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.30); border-radius: 8px; color: #FFFFFF; font-size: 15px; cursor: pointer;">화면 설정</button>
<span style="padding: 2px 8px; border: 1px dashed rgba(255,255,255,0.55); border-radius: 4px; font-size: 13px; color: #CFDBEE;">시연 모드</span>
</div>
</header>

<main style="flex: 1 1 auto; width: 100%; max-width: 1440px; margin: 0 auto; padding: 12px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px;">

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;">
<label style="flex: 0 1 300px; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; background: #FFFFFF; border: 1px solid #7D8590; border-radius: 6px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A525E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg><input type="text" placeholder="로트·작업지시 번호" aria-label="로트 찾기" style="flex: 1 1 auto; min-width: 0; border: 0; outline: none; font-size: 15px; background: transparent;"></label>
<div role="group" aria-label="기간" style="display: flex; gap: 6px;">
<button aria-pressed="true" style="min-height: 44px; padding: 0 14px; border-radius: 6px; border: 1px solid #1F5FBF; background: #1F5FBF; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer;">오늘 + 재고</button>
<button aria-pressed="false" style="min-height: 44px; padding: 0 14px; border-radius: 6px; border: 1px solid #A9BEDF; background: #FFFFFF; color: #174A96; font-size: 14px; font-weight: 600; cursor: pointer;">최근 7일</button>
</div>
<span style="flex: 1 1 auto;"></span>
<span style="font-size: 14px; color: #4A525E;">로트 <b style="font-family: 'IBM Plex Mono', monospace; color: #1B1F24;">14</b></span>
</div>

<div style="flex: 1 1 auto; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; align-items: stretch;">
<sc-for list="{{cols}}" as="c" hint-placeholder-count="7">
<section aria-label="{{c.title}}" style="background: {{c.bg}}; border: 1px solid {{c.bd}}; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0;">
<div style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: #1B2A47;">
<sc-if value="{{c.lock}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1B1F24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></sc-if>
<sc-if value="{{c.warn}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 1.5 21h21L12 2.5z" fill="#F2C200" stroke="#7A6100" stroke-width="1.8" stroke-linejoin="round"></path></svg></sc-if>
<span style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">{{c.title}}</span>
<span style="margin-left: auto; min-width: 24px; padding: 0 7px; border-radius: 999px; background: #FFFFFF; border: 1px solid #D5D9DF; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 13px;">{{c.n}}</span>
</div>
<sc-for list="{{c.cards}}" as="k" hint-placeholder-count="2"><button aria-pressed="{{k.on}}" style="display: flex; flex-direction: column; align-items: stretch; gap: 3px; min-height: 44px; padding: 8px 10px; border-radius: 8px; border: {{k.border}}; background: #FFFFFF; color: #1B1F24; text-align: left; cursor: pointer; box-shadow: {{k.shadow}};">
<b style="font-family: 'IBM Plex Mono', monospace; font-size: 13px;">{{k.no}}</b>
<span style="font-size: 13px; color: #4A525E;">{{k.sub}}</span>
<sc-if value="{{k.alarm}}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: #B42323;"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 1.5 21h21L12 2.5z" fill="#C62F2F"></path><path d="M12 9.5v5.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"></path><circle cx="12" cy="18" r="1.3" fill="#FFFFFF"></circle></svg>992 중 가공</span></sc-if>
<sc-if value="{{k.hasBar}}" hint-placeholder-val="{{ false }}"><span style="display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: #E6E9ED;"><span style="width: {{k.passW}}; background: #4A525E;"></span><span style="width: {{k.failW}}; background: #C62F2F;"></span></span><span style="font-size: 12px; color: #4A525E;">{{k.bar}}</span></sc-if>
</button></sc-for>
<sc-if value="{{c.empty}}" hint-placeholder-val="{{ false }}"><span style="padding: 10px 4px; font-size: 13px; color: #5F6773; text-align: center;">없음</span></sc-if>
<sc-if value="{{c.more}}" hint-placeholder-val="{{ false }}"><button style="min-height: 44px; border-radius: 8px; border: 1px dashed #A9BEDF; background: transparent; color: #174A96; font-size: 13px; cursor: pointer;">{{c.moreText}}</button></sc-if>
</section>
</sc-for>
</div>

<section aria-label="고른 로트" style="background: #FFFFFF; border: 1px solid #D5D9DF; border-radius: 10px; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;">
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 200px;">
<b style="font-family: 'IBM Plex Mono', monospace; font-size: 17px;">LOT-2609-041-1</b>
<span style="font-size: 13px; color: #4A525E;">PO-2609-041 · 10/1 주간 · 투입 20</span>
</div>
<ol aria-label="한 줄 이력" style="list-style: none; margin: 0; padding: 0; flex: 1 1 520px; display: flex; align-items: center; gap: 0; min-width: 0;">
<sc-for list="{{chain}}" as="s" hint-placeholder-count="9"><li style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative;">
<span style="position: absolute; top: 9px; left: -50%; right: 50%; height: 2px; background: {{s.line}};"></span>
<span style="position: relative; width: 18px; height: 18px; border-radius: 50%; background: {{s.dot}}; border: 2px solid {{s.dotBd}}; box-sizing: border-box;"></span>
<span style="font-size: 12px; font-weight: 600; color: {{s.fg}}; white-space: nowrap;">{{s.label}}</span>
<span style="font-size: 11px; color: {{s.subC}}; white-space: nowrap;">{{s.sub}}</span>
</li></sc-for>
</ol>
<div style="display: flex; flex-wrap: wrap; gap: 10px;">
<button disabled="{{ true }}" style="min-height: 44px; padding: 0 16px; border-radius: 6px; border: 1px solid #D5D9DF; background: #EEF0F3; color: #5F6773; font-size: 15px; font-weight: 600; cursor: not-allowed;">해제</button>
<button style="min-height: 44px; padding: 0 16px; border-radius: 6px; border: 1px solid #1F5FBF; background: #1F5FBF; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer;">폐기 제안 2</button>
<a href="#" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 6px; border: 1px solid #A9BEDF; color: #174A96; text-decoration: none;">상세</a>
</div>
</section>
</main>

<footer style="width: 100%; max-width: 1440px; margin: 0 auto 10px; padding: 0 20px; box-sizing: border-box;">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; padding: 7px 14px; background: #FFFFFF; border: 1px solid #D5D9DF; border-radius: 8px; font-size: 13px;">
<b>범례</b>
<span style="display: inline-flex; align-items: center; gap: 5px;"><span style="width: 16px; height: 10px; background: #4A525E; border: 2px solid #8FCB9B; border-radius: 2px;"></span>가공</span>
<span style="display: inline-flex; align-items: center; gap: 5px;"><span style="width: 16px; height: 10px; background: #D5D9DF; border-radius: 2px;"></span>대기</span>
<span style="display: inline-flex; align-items: center; gap: 5px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#4A525E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4 2.5-2.5z"></path></svg>준비</span>
<span style="display: inline-flex; align-items: center; gap: 5px;"><span style="width: 16px; height: 10px; border-radius: 2px; background: repeating-linear-gradient(45deg, #9AA1AB 0 2px, #E6E9ED 2px 5px);"></span>정비</span>
<span style="display: inline-flex; align-items: center; gap: 5px;"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 1.5 21h21L12 2.5z" fill="#C62F2F"></path><path d="M12 9.5v5.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"></path><circle cx="12" cy="18" r="1.3" fill="#FFFFFF"></circle></svg>고장</span>
<span style="display: inline-flex; align-items: center; gap: 5px;"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#D9731A"></circle><rect x="6" y="10.5" width="12" height="3" rx="1" fill="#FFFFFF"></rect></svg>막힘</span>
<span style="display: inline-flex; align-items: center; gap: 5px;"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 1.5 21h21L12 2.5z" fill="#F2C200" stroke="#7A6100" stroke-width="1.6" stroke-linejoin="round"></path></svg>주의 알람</span>
<span style="display: inline-flex; align-items: center; gap: 5px;"><b style="color: #9A4A00;">20</b>재공</span>
<span style="padding: 0 5px; border: 2px solid #D9731A; border-radius: 4px; line-height: 1.3;">병목</span>
<span aria-hidden="true" style="color: #9AA1AB;">|</span>
<b>알림</b>
<span style="display: inline-flex; align-items: center; gap: 5px;"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 1.5 21h21L12 2.5z" fill="#C62F2F"></path><path d="M12 9.5v5.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"></path><circle cx="12" cy="18" r="1.3" fill="#FFFFFF"></circle></svg>긴급</span>
<span style="display: inline-flex; align-items: center; gap: 5px;"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 1.5 21h21L12 2.5z" fill="#F2C200" stroke="#7A6100" stroke-width="1.6" stroke-linejoin="round"></path><path d="M12 9.5v5.5" stroke="#1B1F24" stroke-width="2.2" stroke-linecap="round"></path><circle cx="12" cy="18" r="1.3" fill="#1B1F24"></circle></svg>주의</span>
<span style="display: inline-flex; align-items: center; gap: 5px;"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#7D8590"></circle><path d="M12 11v6" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"></path><circle cx="12" cy="7.5" r="1.3" fill="#FFFFFF"></circle></svg>참고</span>
<span aria-hidden="true" style="color: #9AA1AB;">|</span>
<span style="display: inline-flex; align-items: center; gap: 5px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1B1F24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg><b>보류</b> · ▲ 보류 검토</span>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const card = (no, sub, o) => Object.assign({ no: no, sub: sub, alarm: false, hasBar: false, passW: '0%', failW: '0%', bar: '', on: false, border: '1px solid #D5D9DF', shadow: 'none' }, o || {});
    const COLS = [
      ['생산 중', [card('LOT-2609-041-2', '16개 · OP-40 · 강화 대기'), card('LOT-2609-042-1', '36개 · OP-20 · 강화 대기')], {}],
      ['검사 대기', [], {}],
      ['판정 대기', [], {}],
      ['보류 검토', [], { warn: true }],
      ['보류', [card('LOT-2609-041-1', '20개 · 11:05 박○○', { alarm: true, hasBar: true, passW: '45%', failW: '10%', bar: '측정 12/20 · 불합격 2', on: true, border: '2px solid #1B1F24', shadow: '0 0 0 3px rgba(31,95,191,0.25)' })], { lock: true, bg: '#FFFFFF', bd: '#1B1F24' }],
      ['합격 (출하 가능)', [card('LOT-2609-040-1', '36개 · 10/1 09:20'), card('LOT-2609-039-1', '36개 · 10/1 08:10'), card('LOT-2609-038-2', '12개 · 10/1 00:40'), card('LOT-2609-038-1', '24개 · 9/30 22:10')], { more: '+4 더 보기', n: 8 }],
      ['출하됨', [card('LOT-2609-032-1', 'SHP-2609-025 · 9/30'), card('LOT-2609-031-1', 'SHP-2609-025 · 9/30'), card('LOT-2609-030-1', 'SHP-2609-025 · 9/30')], {}]
    ];
    const cols = COLS.map(([title, cards, o]) => ({
      title: title, cards: cards, n: o.n !== undefined ? o.n : cards.length, empty: cards.length === 0,
      lock: !!o.lock, warn: !!o.warn, more: !!o.more, moreText: o.more || '',
      bg: o.bg || '#F6F7F9', bd: o.bd || '#E1E5EB'
    }));
    const CH = [['원자재', '9/28', 'done'], ['OP-10', '08:12', 'done'], ['OP-20', '08:40', 'done'], ['OP-30', '⚠ 992', 'alarm'], ['OP-40', '10:30', 'done'], ['OP-50', '12/20', 'now'], ['보류', '11:05', 'hold'], ['입고', '—', 'todo'], ['출하', '금지', 'todo']];
    const chain = CH.map(([label, sub, st], i) => ({
      label: label, sub: sub,
      dot: st === 'todo' ? '#FFFFFF' : (st === 'now' ? '#1F5FBF' : (st === 'alarm' ? '#C62F2F' : (st === 'hold' ? '#FFFFFF' : '#4A525E'))),
      dotBd: st === 'todo' ? '#C3CCD9' : (st === 'hold' ? '#1B1F24' : (st === 'now' ? '#1F5FBF' : (st === 'alarm' ? '#C62F2F' : '#4A525E'))),
      line: i === 0 ? 'transparent' : (st === 'todo' ? '#E1E5EB' : '#A9B5C6'),
      fg: st === 'todo' ? '#5F6773' : '#1B1F24', subC: st === 'alarm' ? '#B42323' : '#4A525E'
    }));
    return { cols: cols, chain: chain };
  }
}
</script>
</body>
</html>
