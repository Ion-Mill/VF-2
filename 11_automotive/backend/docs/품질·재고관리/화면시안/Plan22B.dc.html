<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SCR-22 배치 B 목록·상세형</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#ECEFF4}
a{color:#1F5FBF}a:hover{color:#174A96}
button,select,input{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #1F5FBF;outline-offset:2px}
@keyframes dcRise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
section{box-shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.05);animation:dcRise .35s ease-out both}
h2{color:#1B2A47;font-size:16px!important;line-height:1.35;align-items:center!important}h2::before{content:"";width:10px;height:10px;border-radius:3px;background:#1F5FBF;flex:none}
button,a{transition:background-color .15s,box-shadow .15s,transform .08s,filter .15s}
button:not(:disabled):not([style*="transparent"]):hover,a[style*="min-height"]:hover{filter:brightness(.96);box-shadow:0 3px 10px rgba(31,95,191,.20)}
header button:not(:disabled):hover{background:rgba(255,255,255,.22)!important;filter:none;box-shadow:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="min-height: 100vh; background: #ECEFF4; color: #1B1F24; font-family: 'IBM Plex Sans KR', sans-serif; font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; display: flex; flex-direction: column;">

<header style="background: #1B2A47; color: #FFFFFF; box-shadow: 0 2px 10px rgba(16,24,40,0.20);">
<div style="max-width: 1440px; margin: 0 auto; padding: 6px 20px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;">
<button aria-label="메뉴" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.30); border-radius: 8px; color: #FFFFFF; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
<span style="font-weight: 700; font-size: 19px;">공구 수명</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: #CFDBEE;">10/1 (목) 주간 08:00~17:00 · 13:40</span>
<span style="flex: 1 1 auto;"></span>
<span style="font-weight: 600;">작업자(OPR) 김○○</span>
<button aria-label="처리 안 된 알림 2건" style="min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.30); border-radius: 8px; color: #FFFFFF; font-size: 15px; cursor: pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10 21a2 2 0 0 0 4 0"></path></svg>미처리 2</button>
<button style="min-height: 44px; padding: 0 14px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.30); border-radius: 8px; color: #FFFFFF; font-size: 15px; cursor: pointer;">비서</button>
<button style="min-height: 44px; padding: 0 14px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.30); border-radius: 8px; color: #FFFFFF; font-size: 15px; cursor: pointer;">화면 설정</button>
<span style="padding: 2px 8px; border: 1px dashed rgba(255,255,255,0.55); border-radius: 4px; font-size: 13px; color: #CFDBEE;">시연 모드</span>
</div>
</header>

<main style="flex: 1 1 auto; width: 100%; max-width: 1440px; margin: 0 auto; padding: 12px 20px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch;">

<section aria-label="공구 목록" style="flex: 0 1 380px; min-width: 0; background: #FFFFFF; border: 1px solid #D5D9DF; border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;">
<div role="group" aria-label="설비" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
<button aria-pressed="true" style="min-height: 44px; border-radius: 6px; border: 1px solid #1F5FBF; background: #1F5FBF; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer;">전체 10</button>
<button aria-pressed="false" style="min-height: 44px; border-radius: 6px; border: 1px solid #A9BEDF; background: #FFFFFF; color: #174A96; font-size: 14px; font-weight: 600; cursor: pointer;">VF2-01</button>
<button aria-pressed="false" style="min-height: 44px; border-radius: 6px; border: 1px solid #A9BEDF; background: #FFFFFF; color: #174A96; font-size: 14px; font-weight: 600; cursor: pointer;">VF2-02</button>
</div>
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #4A525E;"><span>사용률 높은 순</span><span>눈금 = 90%</span></div>
<div style="display: flex; flex-direction: column; gap: 4px;">
<sc-for list="{{list}}" as="t" hint-placeholder-count="10"><button aria-pressed="{{t.on}}" aria-label="{{t.aria}}" style="display: grid; grid-template-columns: minmax(0, 1fr) 46px; gap: 4px 8px; align-items: center; min-height: 48px; padding: 5px 10px; border-radius: 6px; border: {{t.border}}; background: {{t.bg}}; color: #1B1F24; text-align: left; cursor: pointer;">
<span style="display: inline-flex; align-items: center; gap: 5px; font-size: 14px; overflow: hidden; white-space: nowrap;"><sc-if value="{{t.warn}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="flex: none;"><path d="M12 2.5 1.5 21h21L12 2.5z" fill="#F2C200" stroke="#7A6100" stroke-width="1.8" stroke-linejoin="round"></path></svg></sc-if><b>{{t.eq}}</b>&nbsp;{{t.no}} {{t.name}}</span>
<b style="text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 14px;">{{t.pct}}</b>
<span style="grid-column: 1 / 3; position: relative; height: 8px; border-radius: 4px; background: #E6E9ED;"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{t.w}}; border-radius: 4px; background: {{t.fill}};"></span><span style="position: absolute; left: 90%; top: -3px; bottom: -3px; border-left: 2px solid #1B2A47;"></span></span>
</button></sc-for>
</div>
</section>

<div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 12px;">
<section style="background: #FFFFFF; border: 1px solid #D5D9DF; border-radius: 10px; padding: 14px 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;">
<div style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 13px; color: #4A525E;">VF2-02 · 가공</span><b style="font-size: 24px; line-height: 1.15;">T02 엔드밀 Ø10</b></div>
<span style="display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 999px; background: #FFF5CC; border: 1px solid #E6CF6E; color: #5C4800; font-weight: 700;"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 1.5 21h21L12 2.5z" fill="#F2C200" stroke="#7A6100" stroke-width="1.8" stroke-linejoin="round"></path></svg>교체 준비</span>
<span style="flex: 1 1 auto;"></span>
<button style="min-height: 52px; padding: 0 24px; border-radius: 8px; border: 1px solid #1F5FBF; background: #1F5FBF; color: #FFFFFF; font-size: 17px; font-weight: 700; cursor: pointer;">공구 교체 기록</button>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch;">
<section style="flex: 1 1 300px; min-width: 0; background: #FFFFFF; border: 1px solid #D5D9DF; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px;">
<span style="position: relative; width: 180px; height: 180px;"><svg width="180" height="180" viewBox="0 0 180 180" aria-hidden="true" style="transform: rotate(-90deg);"><circle cx="90" cy="90" r="72" fill="none" stroke="#E6E9ED" stroke-width="18"></circle><circle cx="90" cy="90" r="72" fill="none" stroke="#E0B000" stroke-width="18" stroke-dasharray="{{dash}}"></circle><line x1="135.3" y1="57.1" x2="166.0" y2="34.8" stroke="#1B2A47" stroke-width="3"></line></svg><span style="position: absolute; left: 0; top: 0; width: 180px; height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center;"><b style="font-family: 'IBM Plex Mono', monospace; font-size: 38px; font-weight: 600; line-height: 1;">91%</b><span style="font-size: 13px; color: #4A525E;">공구 수명 (사용률)</span></span></span>
<span style="font-size: 13px; color: #4A525E;">눈금 = 90%</span>
</section>
<section style="flex: 2 1 380px; min-width: 0; background: #FFFFFF; border: 1px solid #D5D9DF; border-radius: 10px; padding: 12px 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; align-content: start;">
<sc-for list="{{facts}}" as="f" hint-placeholder-count="6"><div style="padding: 8px 12px; border-radius: 8px; background: {{f.bg}}; border: 1px solid {{f.bd}};"><div style="font-size: 13px; color: #4A525E;">{{f.label}}</div><div style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 500;">{{f.val}} <span style="font-family: 'IBM Plex Sans KR', sans-serif; font-size: 12px; color: #4A525E;">{{f.tag}}</span></div></div></sc-for>
</section>
</div>

<section style="background: #FFFFFF; border: 1px solid #D5D9DF; border-radius: 10px; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px;">
<h2 style="margin: 0 0 4px; display: flex; gap: 8px; align-items: center; font-weight: 700;">교체 이력 · VF2-02 T02</h2>
<sc-for list="{{hist}}" as="h" hint-placeholder-count="2"><div style="display: grid; grid-template-columns: 96px minmax(0, 1fr) 90px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 6px 0; border-top: 1px solid #EEF0F3; font-size: 14px;">
<span style="font-family: 'IBM Plex Mono', monospace; color: #4A525E;">{{h.t}}</span><span>{{h.why}}</span><span style="font-family: 'IBM Plex Mono', monospace; text-align: right;">{{h.used}}</span><span style="color: #4A525E;">{{h.by}}</span>
</div></sc-for>
</section>
</div>
</main>

<footer style="width: 100%; max-width: 1440px; margin: 0 auto 10px; padding: 0 20px; box-sizing: border-box;">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; padding: 7px 14px; background: #FFFFFF; border: 1px solid #D5D9DF; border-radius: 8px; font-size: 13px;">
<b>범례</b>
<span style="display: inline-flex; align-items: center; gap: 5px;"><span style="width: 16px; height: 10px; background: #4A525E; border: 2px solid #8FCB9B; border-radius: 2px;"></span>가공</span>
<span style="display: inline-flex; align-items: center; gap: 5px;"><span style="width: 16px; height: 10px; background: #D5D9DF; border-radius: 2px;"></span>대기</span>
<span style="display: inline-flex; align-items: center; gap: 5px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#4A525E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4 2.5-2.5z"></path></svg>준비</span>
<span style="display: inline-flex; align-items: center; gap: 5px;"><span style="width: 16px; height: 10px; border-radius: 2px; background: repeating-linear-gradient(45deg, #9AA1AB 0 2px, #E6E9ED 2px 5px);"></span>정비</span>
<span style="display: inline-flex; align-items: center; gap: 5px;"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 1.5 21h21L12 2.5z" fill="#C62F2F"></path><path d="M12 9.5v5.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"></path><circle cx="12" cy="18" r="1.3" fill="#FFFFFF"></circle></svg>고장</span>
<span style="display: inline-flex; align-items: center; gap: 5px;"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#D9731A"></circle><rect x="6" y="10.5" width="12" height="3" rx="1" fill="#FFFFFF"></rect></svg>막힘</span>
<span style="display: inline-flex; align-items: center; gap: 5px;"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 1.5 21h21L12 2.5z" fill="#F2C200" stroke="#7A6100" stroke-width="1.6" stroke-linejoin="round"></path></svg>주의 알람</span>
<span style="display: inline-flex; align-items: center; gap: 5px;"><b style="color: #9A4A00;">20</b>재공</span>
<span style="padding: 0 5px; border: 2px solid #D9731A; border-radius: 4px; line-height: 1.3;">병목</span>
<span aria-hidden="true" style="color: #9AA1AB;">|</span>
<b>알림</b>
<span style="display: inline-flex; align-items: center; gap: 5px;"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 1.5 21h21L12 2.5z" fill="#C62F2F"></path><path d="M12 9.5v5.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"></path><circle cx="12" cy="18" r="1.3" fill="#FFFFFF"></circle></svg>긴급</span>
<span style="display: inline-flex; align-items: center; gap: 5px;"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 1.5 21h21L12 2.5z" fill="#F2C200" stroke="#7A6100" stroke-width="1.6" stroke-linejoin="round"></path><path d="M12 9.5v5.5" stroke="#1B1F24" stroke-width="2.2" stroke-linecap="round"></path><circle cx="12" cy="18" r="1.3" fill="#1B1F24"></circle></svg>주의</span>
<span style="display: inline-flex; align-items: center; gap: 5px;"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#7D8590"></circle><path d="M12 11v6" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"></path><circle cx="12" cy="7.5" r="1.3" fill="#FFFFFF"></circle></svg>참고</span>
<span aria-hidden="true" style="color: #9AA1AB;">|</span>
<span>▲ 교체 준비</span>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const SPEC = [['T05', 'M6 탭', 400], ['T04', '드릴 Ø5.0', 1000], ['T03', '보링 인서트', 400], ['T02', '엔드밀 Ø10', 200], ['T01', '페이스밀', 400]];
    const USED = { 'VF2-01': [104, 684, 236, 40, 212], 'VF2-02': [312, 868, 148, 182, 91] };
    const all = [];
    Object.keys(USED).forEach((eq) => SPEC.forEach(([no, name, life], i) => all.push({ eq: eq, no: no, name: name, r: USED[eq][i] / life })));
    const list = all.sort((a, b) => b.r - a.r).map((t) => {
      const warn = t.r >= 0.9, on = t.eq === 'VF2-02' && t.no === 'T02';
      return {
        eq: t.eq, no: t.no, name: t.name, pct: Math.round(t.r * 100) + '%', w: (Math.min(1, t.r) * 100).toFixed(1) + '%', warn: warn, on: on,
        fill: warn ? '#E0B000' : '#4A525E', bg: on ? '#EAF1FC' : (warn ? '#FFFBEA' : '#FFFFFF'),
        border: on ? '2px solid #1F5FBF' : (warn ? '1px solid #E6CF6E' : '1px solid #E6E9ED'),
        aria: t.eq + ' ' + t.no + ' ' + t.name + ' 사용률 ' + Math.round(t.r * 100) + '%'
      };
    });
    const C = 2 * Math.PI * 72;
    const facts = [
      ['누적 / 한도', '182 / 200', '분 [참고]', false], ['한도까지', '18', '분', true], ['알람 362 · 174', '—', '', false],
      ['참고값', '—', '모델 없음', false], ['재고 엔드밀 Ø10', '10 / 9', '안전', false], ['교체하면 재고', '9', '▲ 안전 이하', true]
    ].map(([label, val, tag, hi]) => ({ label: label, val: val, tag: tag, bg: hi ? '#FFFBEA' : '#F7FAFE', bd: hi ? '#E6CF6E' : '#DCE5F3' }));
    const hist = [['9/30 21:30', '90% 알림 뒤 교체', '184 / 200', '이○○ OPR']].map(([t, why, used, by]) => ({ t: t, why: why, used: used, by: by }));
    return { list: list, dash: (0.91 * C).toFixed(1) + ' ' + C.toFixed(1), facts: facts, hist: hist };
  }
}
</script>
</body>
</html>
